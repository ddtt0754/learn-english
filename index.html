<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>英语专项培优训练</title>
<style>
:root {
  --bg: #f5f7fa;
  --text: #2c3e50;
  --text2: #7f8c8d;
  --card: #fff;
  --shadow: 0 2px 16px rgba(0,0,0,.06);
  --radius: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}
.container { max-width: 720px; width: 100%; padding: 32px 20px 0; flex: 1; }

/* Header */
.header { text-align: center; margin-bottom: 36px; }
.header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 6px; }
.header .sub { font-size: .85rem; color: var(--text2); font-weight: 400; }
.header .brand { font-size: .78rem; color: var(--text2); margin-top: 2px; }

/* 四宫格 2×2 */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; }
.grid a {
  text-decoration: none; display: block;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px 16px; text-align: center; transition: transform .15s, box-shadow .15s;
  border: 2px solid transparent; cursor: pointer;
}
.grid a:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.1); }
.grid a:active { transform: scale(.97); }
.grid .card-icon { font-size: 2.4rem; margin-bottom: 10px; }
.grid .card-title { font-size: .95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.grid .card-desc { font-size: .7rem; color: var(--text2); line-height: 1.5; }

/* 各格子的强调色 */
.words { border-color: #3b82f6; }
.words .card-icon { color: #3b82f6; }
.words:hover { border-color: #2563eb; }

.grammar { border-color: #22c55e; }
.grammar .card-icon { color: #22c55e; }
.grammar:hover { border-color: #16a34a; }

.passage { border-color: #f59e0b; }
.passage .card-icon { color: #f59e0b; }
.passage:hover { border-color: #d97706; }

.nce { border-color: #a855f7; }
.nce .card-icon { color: #a855f7; }
.nce:hover { border-color: #9333ea; }

.phonics { border-color: #06b6d4; }
.phonics .card-icon { color: #06b6d4; }
.phonics:hover { border-color: #0891b2; }

.resources { border-color: #ec4899; }
.resources .card-icon { color: #ec4899; }
.resources:hover { border-color: #db2777; }

/* Footer */
.site-footer {
  text-align: center; padding: 16px 0 20px;
  color: var(--text2); font-size: .75rem;
  border-top: 1px solid #e2e8f0; margin-top: auto;
}

/* 教练微信号提示框 */
.coach-tip {
  position: relative; display: inline-block;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.coach-tip .tip {
  visibility: hidden; opacity: 0;
  position: absolute; bottom: 145%; left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: linear-gradient(135deg,#35d29a,#2f9df0); color: #fff;
  padding: 7px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap; letter-spacing: .5px; z-index: 99; pointer-events: none;
  box-shadow: 0 6px 18px rgba(47,157,240,.35);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.coach-tip .tip::after {
  content: ""; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #2f9df0;
}
.coach-tip:hover .tip, .coach-tip:active .tip, .coach-tip:focus .tip {
  visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0);
}

/* 移动端 2 列 */
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .header h1 { font-size: 1.35rem; }
}

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>英语专项培优训练</h1>
    <div class="sub">单词 · 语法 · 短文 · 经典教材</div>
  </div>

  <div class="grid">
    <a href="pronunciation/index.html" class="phonics">
      <div class="card-icon">🗣️</div>
      <div class="card-title">语音基础</div>
      <div class="card-desc">国际音标 · 自然拼读 · 连读弱读 · 语调</div>
    </a>
    <a href="https://qwertylearner.cn/gallery" class="words" target="_blank" rel="noopener">
      <div class="card-icon">🔤</div>
      <div class="card-title">单词练习</div>
      <div class="card-desc">拼写强化 · 词义巩固</div>
    </a>
    <a href="grammar/index.html" class="grammar">
      <div class="card-icon">📖</div>
      <div class="card-title">语法练习</div>
      <div class="card-desc">知识导图 · 每日一练</div>
    </a>
    <a href="passage/index.html" class="passage">
      <div class="card-icon">📚</div>
      <div class="card-title">短文练习</div>
      <div class="card-desc">演讲稿 · 听读说写</div>
    </a>
    <a href="nce/index.html" class="nce">
      <div class="card-icon">🎓</div>
      <div class="card-title">新概念英语</div>
      <div class="card-desc">经典教材 · 情景视频</div>
    </a>
    <a href="resources/index.html" class="resources">
      <div class="card-icon">📦</div>
      <div class="card-title">课程资源</div>
      <div class="card-desc">学习方法 · 视频资料</div>
    </a>
  </div>
</div>

</body>
</html>
