<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎬 何凯文 · 第6讲：小初高所有的句式和语法</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  display:flex;flex-direction:column;
}
/* 顶部标题条 */
.v-header{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 14px;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
  color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);text-align:center;
}
/* 视频区：居中自适应浏览器大小 */
.v-stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:14px;
}
.v-stage video{
  max-width:100%;max-height:100%;width:auto;height:auto;
  background:#000;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
/* 控制条 */
.v-controls{
  flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(15,23,42,.95);
}
.vc-btn{
  padding:10px 18px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;transition:background .15s,transform .12s;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.vc-btn:hover{background:rgba(255,255,255,.25)}
.vc-btn:active{transform:scale(.95)}
.vc-btn.close{background:#ef4444;border-color:transparent}
.vc-btn.close:hover{background:#dc2626}
.vc-speed{color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:8px;min-width:78px;text-align:center;font-weight:700}
@media (max-width:560px){
  .vc-btn{padding:9px 14px;font-size:13px}
}
</style>
</head>
<body>

<div class="v-header">🎬 何凯文 · 第6讲：小初高所有的句式和语法</div>

<div class="v-stage">
  <video id="videoPlayer" src="6.mp4" preload="metadata" playsinline controls autoplay></video>
</div>

<div class="v-controls">
  <span class="vc-speed" id="speedLabel">1.0x</span>
  <button class="vc-btn" onclick="slowDown()">⏪ 变慢</button>
  <button class="vc-btn" onclick="speedUp()">⏩ 变快</button>
  <button class="vc-btn" id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
  <button class="vc-btn close" onclick="closeWin()">✖ 关闭</button>
</div>

<script>
var vid = document.getElementById('videoPlayer');
var pauseBtn = document.getElementById('pauseBtn');
var speedLabel = document.getElementById('speedLabel');
var speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
var speedIdx = 2;

// 关闭 = 关闭当前窗口
function closeWin(){
  try{ window.close(); }catch(e){}
  setTimeout(function(){
    document.body.style.opacity = .3;
  }, 300);
}
function togglePause(){
  if(vid.paused){
    vid.play();
    pauseBtn.textContent = '⏸ 暂停';
  }else{
    vid.pause();
    pauseBtn.textContent = '▶ 继续';
  }
}
function speedUp(){
  if(speedIdx < speeds.length - 1) speedIdx++;
  applySpeed();
}
function slowDown(){
  if(speedIdx > 0) speedIdx--;
  applySpeed();
}
function applySpeed(){
  vid.playbackRate = speeds[speedIdx];
  speedLabel.textContent = speeds[speedIdx].toFixed(2).replace(/\.?0+$/, '') + 'x';
}
vid.addEventListener('play', function(){ pauseBtn.textContent = '⏸ 暂停'; });
vid.addEventListener('pause', function(){ pauseBtn.textContent = '▶ 继续'; });
vid.addEventListener('ended', function(){ pauseBtn.textContent = '▶ 继续'; });

// 键盘快捷键
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' || e.key === 'Delete') closeWin();
  if(e.key === ' ') { e.preventDefault(); togglePause(); }
  if(e.key === 'ArrowLeft') slowDown();
  if(e.key === 'ArrowRight') speedUp();
});
</script>
</body>
</html>
