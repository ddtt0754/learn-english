<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>短文听读说写训练 · 打印版导航</title>
<style>
  /* ============ 全局 ============ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --green:#2ebd85;
    --green-deep:#1fa873;
    --blue:#2f9df0;
    --text:#33434b;
    --text-light:#8aa09a;
    --card:#ffffff;
    --shadow:0 8px 22px rgba(47,157,240,.10);
    --radius:16px;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 16px calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .container{
    width:100%;
    max-width:560px;               /* 手机/PC 均居中，PC 上限制最大宽度 */
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ============ 顶部标题卡（绿蓝渐变） ============ */
  .title-card{
    position:relative;
    width:100%;
    background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
    border-radius:22px;
    padding:30px 20px 26px;
    text-align:center;
    color:#fff;
    overflow:hidden;
    box-shadow:0 14px 30px rgba(47,157,240,.25);
  }
  .title-card::before,.title-card::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.14);
  }
  .title-card::before{width:120px;height:120px;top:-40px;right:-30px;}
  .title-card::after{width:70px;height:70px;bottom:-24px;left:-16px;}
  .title-card h1{
    position:relative;
    font-size:22px;
    letter-spacing:2px;
    font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .title-card .sub{
    position:relative;
    margin-top:10px;
    font-size:13px;
    letter-spacing:4px;
    opacity:.92;
  }
  .title-card .sub b{font-weight:600;margin:0 2px;}

  /* ============ 年级标签页（3~9 年级共 7 个，4 列两行） ============ */
  .tabs{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:16px;
  }
  .tab{
    border:none;
    background:#fff;
    color:var(--text-light);
    font-size:14px;
    padding:10px 0;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(47,157,240,.08);
    transition:transform .15s ease,box-shadow .25s,background-color .25s,color .25s;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .tab:active{transform:scale(.95);}
  .tab.active{
    background:linear-gradient(135deg,#35d29a,#2f9df0);
    color:#fff;
    font-weight:600;
    box-shadow:0 8px 16px rgba(47,157,240,.28);
  }

  /* ============ 下拉单选（年级 + 学期） ============ */
  .controls{
    width:100%;
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .select-wrap{position:relative;flex:1;}
  .select-wrap select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    border:1.5px solid #d8ebe3;
    border-radius:12px;
    background:#fff;
    padding:11px 34px 11px 14px;
    font-size:15px;
    color:var(--text);
    cursor:pointer;
    outline:none;
    transition:border-color .25s,box-shadow .25s;
  }
  .select-wrap select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,189,133,.15);}
  .select-wrap::after{
    content:"";
    position:absolute;
    right:14px;top:50%;
    width:7px;height:7px;
    border-right:2px solid #9db8ae;
    border-bottom:2px solid #9db8ae;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  /* ============ 当前学期信息栏 ============ */
  .info{
    width:100%;
    margin-top:14px;
    background:#fff;
    border-radius:12px;
    padding:9px 12px;
    text-align:center;
    font-size:13px;
    color:var(--text-light);
    box-shadow:0 4px 10px rgba(47,157,240,.06);
  }
  .info b{color:var(--green-deep);font-weight:600;}

  /* ============ 单元网格（每单元一张卡片，含演讲稿/单词表两个入口） ============ */
  .grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);   /* 手机两列，卡片内两个入口更舒展 */
    gap:12px;
    margin-top:14px;
  }
  @media (min-width:560px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .cell{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 10px 14px;
    text-align:center;
    color:var(--text);
    border:1.5px solid transparent;
    transition:transform .15s ease,box-shadow .3s,border-color .3s;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    animation:riseIn .35s ease backwards;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (hover:hover){
    .cell:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(47,157,240,.16);}
  }
  .cell .num{
    position:absolute;
    top:9px;left:12px;
    font-size:11px;
    font-weight:700;
    color:#a8d9c3;
  }
  .cell .icon{font-size:24px;line-height:1;}
  .cell .name{font-size:15px;font-weight:600;letter-spacing:.5px;margin-top:5px;}
  .cell .hint{font-size:10px;color:#b3c4be;letter-spacing:2px;margin-top:2px;}

  /* 单元内的两个入口按钮 */
  .entry{
    display:flex;
    gap:8px;
    width:100%;
    margin-top:12px;
  }
  .btn-link{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-height:38px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    background:#eefaf4;
    color:var(--green-deep);
    border:1.5px solid #cdeee0;
    cursor:pointer;
    transition:transform .1s,filter .2s,background-color .3s,color .3s;
    touch-action:manipulation;
  }
  .btn-link:active{transform:scale(.95);}
  .btn-link.alt{background:#eef4fb;color:#2f6ba3;border-color:#d3e5f6;}
  .btn-link.opening{
    background:linear-gradient(135deg,#2ebd85,#22a06f);
    color:#fff;
    border-color:var(--green-deep);
  }
  .btn-link.alt.opening{background:linear-gradient(135deg,#2f9df0,#2675c8);border-color:#2675c8;}
  .btn-link.opening span{color:#fff;}

  /* ============ 底部版权 ============ */
  footer{
    width:100%;
    margin-top:26px;
    text-align:center;
    font-size:12px;
    color:#a8bcb4;
    letter-spacing:1px;
  }

  @media (max-width:360px){
    .title-card h1{font-size:19px;letter-spacing:1px;}
    .tab{font-size:13px;}
    .cell .name{font-size:14px;}
  }
</style>
</head>
<body>
<div class="container">

  <!-- 顶部标题 -->
  <header class="title-card">
    <h1>🖨️ 短文听读说写训练 · 打印版</h1>
    <p class="sub">单词表<b>·</b>演讲稿</p>
  </header>

  <!-- 年级标签页（选择年级后自动切换） -->
  <nav class="tabs" id="tabs"></nav>

  <!-- 下拉单选：年级 + 学期 -->
  <div class="controls">
    <div class="select-wrap">
      <select id="gradeSelect" aria-label="选择年级"></select>
    </div>
    <div class="select-wrap">
      <select id="semesterSelect" aria-label="选择学期"></select>
    </div>
  </div>

  <!-- 当前学期信息 -->
  <p class="info" id="info"></p>

  <!-- 单元网格 -->
  <div class="grid" id="grid"></div>

  <!-- 底部版权 -->
  <footer>© 2026 两英豆豆教练 · 打印版导航</footer>
</div>

<script>
/* =====================================================================
 * ★ 静态数据区 —— 后期新增单元 / 修改链接，只需改动这里 ★
 *
 * 文件命名规则（print 目录内）：
 *   演讲稿：级数-单元数-speech.html（九年级上册 Unit 1 特殊：9a-unit1_speech.html）
 *   单词表：级数-单元数-words.html（九年级上册已生成 9a-unit1~7-words.html）
 * 用法：
 *   mk("四年级", 6)  → 生成 Unit 1~6，speech + words 都有
 *   mk("九年级", 7, {speechOnly:true}) → 只生成 speech，words 为 null
 *   单个覆盖：DATA["九年级"]["上册"][0].speech = "9a-unit1_speech.html"
 * ===================================================================== */

const GRADE_NO = { "三年级":3, "四年级":4, "五年级":5, "六年级":6, "七年级":7, "八年级":8, "九年级":9 };

/* 生成单元数据：默认 speech + words 双入口；speechOnly=true 时只有演讲稿 */
function mk(grade, n, opt){
  const g = GRADE_NO[grade];
  const only = opt && opt.speechOnly;
  return Array.from({ length:n }, (_,i)=>({
    name: "Unit "+(i+1),
    speech: g + "a-unit" + (i+1) + "-speech.html",
    words: only ? null : (g + "a-unit" + (i+1) + "-words.html")
  }));
}

/* 打印版已有文件（2026-08 生成）：
   3a: Unit 1；4a/5a/6a: Unit 1~6；7a: Unit 1~7；8a: Unit 1~8；9a: Unit 1~7（仅演讲稿）
   后续生成新单元后，直接在该年级 mk() 的 n 上 +1 即可 */
const DATA = {
  "三年级": { "上册": mk("三年级",6) },
  "四年级": { "上册": mk("四年级",6) },
  "五年级": { "上册": mk("五年级",6) },
  "六年级": { "上册": mk("六年级",6) },
  "七年级": { "上册": mk("七年级",7) },
  "八年级": { "上册": mk("八年级",8) },
  "九年级": { "上册": mk("九年级",7) }
};
/* 九年级 Unit 1 演讲稿文件名为特殊格式 */
DATA["九年级"]["上册"][0].speech = "9a-unit1_speech.html";

/* ================= 渲染逻辑（一般无需修改） ================= */
const tabsEl = document.getElementById("tabs");
const gradeSelect = document.getElementById("gradeSelect");
const semesterSelect = document.getElementById("semesterSelect");
const infoEl = document.getElementById("info");
const gridEl = document.getElementById("grid");

const state = { grade: Object.keys(DATA)[0], semester: "" };

function getSemesters(){
  const sems = DATA[state.grade] ? Object.keys(DATA[state.grade]) : [];
  return sems.length ? sems : ["上册"];
}

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(DATA).forEach(g=>{
    const b = document.createElement("button");
    b.className = "tab" + (g===state.grade ? " active" : "");
    b.textContent = g;
    b.dataset.grade = g;
    b.addEventListener("click", ()=>selectGrade(g));
    tabsEl.appendChild(b);
  });
}

function buildGradeSelect(){
  gradeSelect.innerHTML = "";
  Object.keys(DATA).forEach(g=>{
    const o = document.createElement("option");
    o.value = g;
    o.textContent = g;
    gradeSelect.appendChild(o);
  });
  gradeSelect.value = state.grade;
}

function buildSemesterSelect(){
  semesterSelect.innerHTML = "";
  const sems = getSemesters();
  if(!sems.includes(state.semester)) state.semester = sems[0];
  sems.forEach(s=>{
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    semesterSelect.appendChild(o);
  });
  semesterSelect.value = state.semester;
}

function selectGrade(g){
  if(!DATA[g]) return;
  state.grade = g;
  gradeSelect.value = g;
  [...tabsEl.children].forEach(t=>t.classList.toggle("active", t.dataset.grade===g));
  buildSemesterSelect();
  renderGrid();
}

/* 入口点击：整格按钮变绿显示"打开中…"，再跳转 */
function bindEntry(a, url){
  a.addEventListener("click", e=>{
    e.preventDefault();
    a.classList.add("opening");
    const t = a.querySelector("span");
    if(t) t.textContent = "打开中…";
    setTimeout(()=>{ location.href = url; }, 450);
  });
}

function renderGrid(){
  const units = (DATA[state.grade] && DATA[state.grade][state.semester]) || [];
  const withWords = units.filter(u=>u.words).length;
  infoEl.innerHTML = `当前：<b>${state.grade}</b> · <b>${state.semester}</b> · 共 <b>${units.length}</b> 个单元（演讲稿 ${units.length} 份 · 单词表 ${withWords} 份）`;
  gridEl.innerHTML = "";

  units.forEach((u,i)=>{
    const d = document.createElement("div");
    d.className = "cell";
    d.style.animationDelay = (i*40)+"ms";
    d.innerHTML =
      `<span class="num">${String(i+1).padStart(2,"0")}</span>` +
      `<span class="icon">📖</span>` +
      `<span class="name">${u.name}</span>` +
      `<span class="hint">听 · 读 · 说 · 写</span>` +
      `<span class="entry"></span>`;

    const entry = d.querySelector(".entry");

    const bSpeech = document.createElement("a");
    bSpeech.className = "btn-link";
    bSpeech.href = u.speech;
    bSpeech.innerHTML = "<span>📝 演讲稿</span>";
    entry.appendChild(bSpeech);

    if(u.words){
      const bWords = document.createElement("a");
      bWords.className = "btn-link alt";
      bWords.href = u.words;
      bWords.innerHTML = "<span>📖 单词表</span>";
      entry.appendChild(bWords);
      bindEntry(bWords, u.words);
    }
    bindEntry(bSpeech, u.speech);

    gridEl.appendChild(d);
  });
}

gradeSelect.addEventListener("change", ()=>selectGrade(gradeSelect.value));
semesterSelect.addEventListener("change", ()=>{ state.semester = semesterSelect.value; renderGrid(); });

state.semester = getSemesters()[0];
buildTabs();
buildGradeSelect();
buildSemesterSelect();
renderGrid();
</script>
</body>
</html>
