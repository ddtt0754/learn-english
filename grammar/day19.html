<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>Day19 动词4 动词变化规则 · 中考语法每日一练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--green:#2ebd85;--green-deep:#1fa873;--blue:#2f9df0;--text:#33434b;--sub:#8aa09a;--red:#d93025;--orange:#e37400;--card:#fff}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);color:var(--text);line-height:1.7;min-height:100vh}
.brand-wrap{max-width:760px;margin:0 auto;padding:18px 14px 0}
.title-card{position:relative;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);border-radius:22px;padding:24px 20px 20px;text-align:center;color:#fff;overflow:hidden;box-shadow:0 14px 30px rgba(47,157,240,.25)}
.title-card::before,.title-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.title-card::before{width:120px;height:120px;top:-40px;right:-30px}
.title-card::after{width:70px;height:70px;bottom:-24px;left:-16px}
.title-card h1{position:relative;font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.12)}
.title-card .sub{position:relative;margin-top:6px;font-size:12.5px;letter-spacing:2px;opacity:.94}
.title-card .meta{position:relative;margin-top:8px;font-size:12px;opacity:.9}
.timer{position:relative;display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 16px;font-size:14px;font-weight:700;letter-spacing:1px}
.kb-link{position:relative;display:inline-block;margin-top:10px;margin-left:8px;background:rgba(255,255,255,.95);color:var(--green-deep);border:1.5px solid rgba(255,255,255,.95);border-radius:999px;padding:5px 18px;font-size:13px;font-weight:700;text-decoration:none;transition:transform .15s}
.kb-link:active{transform:scale(.96)}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.sec{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(47,157,240,.08)}
.sec-head{font-size:15px;font-weight:700;color:#2f6ba3;margin-bottom:4px}
.sec-note{font-size:11.5px;color:var(--sub);margin-bottom:12px}
.q{padding:10px 0;border-bottom:1px dashed #e8f0ec}
.q:last-child{border-bottom:none}
.q .qn{font-weight:700;color:var(--green-deep);margin-right:6px}
.q .stem{font-size:14.5px}
.q .blank{color:#e11d48;font-weight:700}
.q input[type=text]{display:block;width:100%;margin-top:8px;padding:9px 12px;border:1.5px solid #d3e5f6;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fbfdff}
.q input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px #eef4fb}
.q textarea{display:block;width:100%;margin-top:8px;padding:9px 12px;border:1.5px solid #d3e5f6;border-radius:10px;font-size:14px;font-family:inherit;outline:none;min-height:52px;resize:vertical;background:#fbfdff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{padding:8px 14px;border:1.5px solid #d3e5f6;border-radius:10px;font-size:13.5px;background:#fff;cursor:pointer;transition:.15s;user-select:none}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.submit-wrap{text-align:center;margin:8px 0 20px}
.submit-btn{padding:13px 40px;border:none;border-radius:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#35d29a,#2f9df0);cursor:pointer;box-shadow:0 4px 14px rgba(47,157,240,.25);transition:transform .15s}
.submit-btn:active{transform:scale(.97)}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:#fff;color:var(--green-deep);border:1.5px solid var(--green);border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(46,158,107,.12)}
.back-wrap{text-align:center;margin:4px 0 4px}
footer{text-align:center;font-size:11.5px;color:#a8bcb4;padding:16px 0 28px}
/* 报告 */
.report{background:#fff;border-radius:16px;padding:20px;margin:14px;box-shadow:0 8px 22px rgba(47,157,240,.12)}
.report h2{text-align:center;font-size:18px;color:#2f6ba3;margin-bottom:14px}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.r-cell{background:#f8fafd;border-radius:12px;padding:12px;text-align:center}
.r-cell .lbl{font-size:11px;color:var(--sub)}
.r-cell .val{font-size:22px;font-weight:800;color:#2f6ba3;margin-top:2px}
.r-cell .val.good{color:var(--green-deep)}
.r-cell .val.bad{color:var(--red)}
.weak{background:#fef7e0;border-left:4px solid var(--orange);border-radius:0 10px 10px 0;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.8;color:#7a5b23}
.err-box{margin-top:12px}
.err-box h3{font-size:14px;color:var(--red);margin-bottom:8px}
.err-item{background:#fef2f2;border:1px solid #f5c6c6;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.err-item .stem{color:#333}
.err-item .wrong{color:var(--red);font-weight:700;text-decoration:line-through}
.err-item .right{color:var(--green-deep);font-weight:700}
</style>
</head>
<body>
<div class="brand-wrap">
  <header class="title-card">
    <h1>📝 Day19 动词4 动词变化规则</h1>
    <p class="sub">中考语法每日一练</p>
    <div class="timer">⏱ <span id="timer">00:00</span></div>
    <a href="lesson19.html" class="kb-link">📚 知识讲解</a>
  </header>
</div>
<div class="wrap" id="quiz"></div>
<div class="submit-wrap"><button class="submit-btn" id="submitBtn" onclick="submit()">✅ 提交</button></div>
<div class="report" id="report" style="display:none"></div>
<div class="back-wrap"><a href="daily_practice.html" class="back-btn">🏠 返回目录</a></div>
<footer>© 2026 两英豆豆教练 · 中考语法每日一练</footer>
<script>
const DATA = {"sections": [{"title": "一、写出下列动词的过去式", "note": "动词过去式变化", "type": "fill", "questions": [{"q": "plant", "a": "planted"}, {"q": "cook", "a": "cooked"}, {"q": "plan", "a": "planned"}, {"q": "dance", "a": "danced"}, {"q": "like", "a": "liked"}, {"q": "try", "a": "tried"}]}, {"title": "二、写出下列动词的三单形式", "note": "动词第三人称单数", "type": "fill", "questions": [{"q": "do", "a": "does"}, {"q": "play", "a": "plays"}, {"q": "teach", "a": "teaches"}, {"q": "carry", "a": "carries"}, {"q": "have", "a": "has"}, {"q": "fix", "a": "fixes"}]}, {"title": "三、写出下列动词的现在分词形式", "note": "动词-ing 形式", "type": "fill", "questions": [{"q": "say", "a": "saying"}, {"q": "die", "a": "dying"}, {"q": "take", "a": "taking"}, {"q": "use", "a": "using"}, {"q": "run", "a": "running"}, {"q": "get", "a": "getting"}]}, {"title": "四、根据句意用所给单词的适当形式填空", "note": "动词形式综合", "type": "fill", "questions": [{"q": "____ (do) Amy like ____ (take) photos?", "a": ["Does", "taking"]}, {"q": "Mike often ____ (watch) TV in the evening.", "a": "watches"}, {"q": "Listen! Eric ____ (sing) in the classroom.", "a": "is singing"}, {"q": "Alice ____ (arrive) in Beijing last Sunday.", "a": "arrived"}, {"q": "Sam's grandpa usually ____ (have) breakfast on time.", "a": "has"}, {"q": "They ____ (swim) in the pool now.", "a": "are swimming"}]}]};
let startTime = Date.now();
let timerInt = null;
timerInt = setInterval(function(){
  const s = Math.floor((Date.now()-startTime)/1000);
  document.getElementById('timer').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const root = document.getElementById('quiz');
  let html = '';
  DATA.sections.forEach(function(sec, si){
    html += '<div class="sec"><div class="sec-head">'+esc(sec.title)+'</div>';
    if(sec.note) html += '<div class="sec-note">'+esc(sec.note)+'</div>';
    sec.questions.forEach(function(q, qi){
      const id = 'q_'+si+'_'+qi;
      html += '<div class="q"><span class="qn">'+(qi+1)+'.</span>';
      if(sec.type === 'choice'){
        html += '<span class="stem">'+esc(q.q)+'</span><div class="opts">';
        q.options.forEach(function(o, oi){
          html += '<span class="opt" data-id="'+id+'" data-oi="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</span>';
        });
        html += '</div>';
      } else if(sec.type === 'translate'){
        html += '<span class="stem">'+esc(q.q)+'</span><textarea data-id="'+id+'" placeholder="请输入英文翻译…"></textarea>';
      } else {
        html += '<span class="stem">'+esc(q.q)+'</span><input type="text" data-id="'+id+'" autocomplete="off" placeholder="请输入答案">';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  root.innerHTML = html;
  // 绑定选择
  document.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){
      const id = el.getAttribute('data-id');
      const oi = el.getAttribute('data-oi');
      document.querySelectorAll('.opt[data-id="'+id+'"]').forEach(function(o){o.classList.remove('on');});
      el.classList.add('on');
    });
  });
}

function getAnswer(si, qi){
  const id = 'q_'+si+'_'+qi;
  const sec = DATA.sections[si];
  if(sec.type === 'choice'){
    const on = document.querySelector('.opt.on[data-id="'+id+'"]');
    return on ? parseInt(on.getAttribute('data-oi')) : null;
  } else {
    const el = document.querySelector('[data-id="'+id+'"]');
    return el ? el.value.trim() : '';
  }
}

function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g,'');}

function judge(sec, q, ans){
  if(sec.type === 'choice'){
    return ans === q.a;
  }
  // fill / translate
  const refs = Array.isArray(q.a) ? q.a : [q.a];
  if(sec.type === 'translate'){
    // 关键词匹配：参考答案中每个英文单词是否出现在学生答案中
    const refWords = String(refs[0]).toLowerCase().split(/[^a-z]+/).filter(function(w){return w.length>1;});
    const ansWords = norm(ans);
    let hit = 0;
    refWords.forEach(function(w){ if(ansWords.indexOf(w)>=0) hit++; });
    return refWords.length ? (hit/refWords.length) >= 0.5 : false;
  }
  return refs.some(function(r){ return norm(r) === norm(ans) && norm(ans)!==''; });
}

function submit(){
  clearInterval(timerInt);
  const secs = Math.floor((Date.now()-startTime)/1000);
  let total=0, right=0;
  const details = [];
  const secStat = DATA.sections.map(function(){ return {total:0, right:0}; });
  DATA.sections.forEach(function(sec, si){
    sec.questions.forEach(function(q, qi){
      total++;
      secStat[si].total++;
      const ans = getAnswer(si, qi);
      const ok = judge(sec, q, ans);
      if(ok){ right++; secStat[si].right++; }
      details.push({si:si, qi:qi, sec:sec, q:q, ans:ans, ok:ok});
    });
  });
  const rate = total ? Math.round(right/total*100) : 0;
  // 找薄弱点：正确率最低的 section
  let weakSec = null, weakRate = 1;
  secStat.forEach(function(s, i){
    if(s.total>0){ const r = s.right/s.total; if(r<weakRate){ weakRate=r; weakSec=i; } }
  });
  // 渲染报告
  let html = '<h2>📊 本节语法知识点 AI 分析报告</h2><div class="r-grid">';
  html += '<div class="r-cell"><div class="lbl">正答率</div><div class="val '+(rate>=80?'good':(rate<60?'bad':''))+'">'+rate+'%</div></div>';
  html += '<div class="r-cell"><div class="lbl">测试时长</div><div class="val">'+Math.floor(secs/60)+'分'+secs%60+'秒</div></div>';
  html += '<div class="r-cell"><div class="lbl">答对题数</div><div class="val">'+right+' / '+total+'</div></div>';
  const grade = rate>=90?'A+（优秀）':rate>=80?'A（良好）':rate>=60?'B（达标）':'C（需加强）';
  html += '<div class="r-cell"><div class="lbl">等级</div><div class="val">'+grade+'</div></div>';
  html += '</div>';
  // 薄弱点
  if(weakSec !== null && weakRate < 1){
    const wn = DATA.sections[weakSec].title;
    html += '<div class="weak">⚠️ <b>薄弱点提醒：</b>「'+esc(wn)+'」正确率偏低（'+Math.round(weakRate*100)+'%）。建议重点复习本节相关语法规则，可回到知识导图页对照巩固后再练一遍。</div>';
  }
  // 错题
  const errs = details.filter(function(d){return !d.ok;});
  if(errs.length){
    html += '<div class="err-box"><h3>❌ 出错题目（'+errs.length+' 题）</h3>';
    errs.forEach(function(d){
      const ref = Array.isArray(d.q.a) ? d.q.a.join(' / ') : d.q.a;
      let userAns = '';
      if(d.sec.type==='choice'){ userAns = d.ans===null ? '未作答' : String.fromCharCode(65+d.ans); }
      else { userAns = d.ans || '未作答'; }
      html += '<div class="err-item"><div class="stem">'+(d.qi+1)+'. '+esc(d.q.q)+'</div><div>你的答案：<span class="wrong">'+esc(userAns)+'</span>　正确答案：<span class="right">'+esc(ref)+'</span></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="weak" style="background:#e6f4ea;border-color:#2ebd85;color:#1b6d3a">🎉 全部答对，本节语法掌握扎实，继续保持！</div>';
  }
  document.getElementById('report').innerHTML = html;
  document.getElementById('report').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '已提交';
  document.getElementById('report').scrollIntoView({behavior:'smooth'});
}

render();
</script>
</body>
</html>
