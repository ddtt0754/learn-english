<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人教版英语 3-9 年级 · 单元语法知识导图</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#4f6df5; --accent-soft:#eef1fe; --new:#0ea5a0; --old:#d97706;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
.hero{padding:18px 0 6px}
.hero h1{font-size:20px;font-weight:800;letter-spacing:.5px}
.hero p{font-size:12.5px;color:var(--sub);margin-top:2px}
.search{margin:10px 0 12px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:#fff;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.grades{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.gpill{flex:0 0 auto;padding:7px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s;white-space:nowrap}
.gpill.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,109,245,.3)}
.vols{display:flex;gap:8px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.vols::-webkit-scrollbar{display:none}
.vtab{flex:1;min-width:150px;text-align:left;padding:9px 12px;border-radius:12px;background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:.15s}
.vtab .t{font-size:14px;font-weight:700}
.vtab .s{font-size:11px;margin-top:2px}
.vtab.on{border-color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;vertical-align:middle}
.badge.new{background:#d9f5f3;color:var(--new)}
.badge.old{background:#fdf0dc;color:var(--old)}
main{padding:6px 0 60px}
.notice{font-size:12px;color:var(--old);background:#fdf6ea;border:1px solid #f3e3c3;border-radius:10px;padding:8px 12px;margin:8px 0 12px}
.overview{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chip{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--sub);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.unit-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.unit-num{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.unit-title{flex:1;min-width:0}
.unit-title .en{font-size:15px;font-weight:700;line-height:1.3}
.unit-title .cn{font-size:12px;color:var(--sub)}
.unit-count{flex:0 0 auto;font-size:11px;color:var(--sub);background:var(--bg);border-radius:999px;padding:2px 9px}
.arrow{flex:0 0 auto;color:var(--sub);transition:transform .25s;font-size:13px}
.unit.open .arrow{transform:rotate(90deg)}
.unit-body{display:none;padding:2px 14px 16px}
.unit.open .unit-body{display:block}
.tree{position:relative;margin-top:8px}
.root{display:flex;justify-content:center;margin-bottom:4px}
.root span{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#7c8ff8);padding:4px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(79,109,245,.25)}
.branches{position:relative;padding-left:18px}
.branches::before{content:"";position:absolute;left:5px;top:-6px;bottom:14px;width:2px;background:linear-gradient(var(--accent),#c7d0fb);border-radius:2px}
.gnode{position:relative;background:#fbfbfe;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
.gnode::before{content:"";position:absolute;left:-17px;top:20px;width:13px;height:2px;background:#c7d0fb}
.gnode::after{content:"";position:absolute;left:-7px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
.gname{font-size:14px;font-weight:700;color:var(--accent)}
.gdesc{font-size:13px;margin-top:4px;color:#374151}
.ex{margin-top:8px;border-left:3px solid var(--accent-soft);padding-left:10px}
.ex .en{font-size:13.5px;font-weight:600;color:#111827}
.ex .cn{font-size:12px;color:var(--sub)}
.ex+.ex{margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.toolbar .stat{font-size:12px;color:var(--sub)}
.toolbar button{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--sub);cursor:pointer}
.toolbar button:hover{color:var(--accent);border-color:var(--accent)}
footer{text-align:center;font-size:11.5px;color:var(--sub);padding:20px 0 30px}
mark{background:#fff2a8;border-radius:3px;padding:0 1px}
/* 顶部品牌标题卡（绿蓝渐变，与全站一致） */
.brand-wrap{max-width:860px;margin:0 auto;padding:18px 14px 0}
.title-card{position:relative;width:100%;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);border-radius:22px;padding:26px 20px 22px;text-align:center;color:#fff;overflow:hidden;box-shadow:0 14px 30px rgba(47,157,240,.25)}
.title-card::before,.title-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.title-card::before{width:120px;height:120px;top:-40px;right:-30px}
.title-card::after{width:70px;height:70px;bottom:-24px;left:-16px}
.title-card h1{position:relative;font-size:22px;letter-spacing:2px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.12)}
.title-card .sub{position:relative;margin-top:8px;font-size:13px;letter-spacing:4px;opacity:.94}
.title-card .meta{position:relative;margin-top:10px;font-size:12px;opacity:.88;letter-spacing:1px}
/* 返回首页按钮 */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;background:#fff;color:#1fa873;border:1.5px solid #2ebd85;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(46,158,107,.12);transition:transform .15s}
.back-btn:active{transform:scale(.97)}
@media(min-width:640px){.hero h1{font-size:24px}.gname{font-size:15px}}

/* 教练微信号提示框 */
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.coach-footer{text-align:center;padding:14px 0 18px;color:var(--text2,#7f8c8d);font-size:.75rem}

</style>
</head>

<div class="brand-wrap">
  <header class="title-card">
    <h1>📚 单元语法知识导图</h1>

   {n:"It's time for/to...",d:"该做某事了：for 后接名词，to 后接动词原形。",e:[["It's time for school.","该上学了。"],["It's time to get up.","该起床了。"]]}]},
  {n:"U4",en:"Going shopping",cn:"去购物",g:[
   {n:"购物交际 How much...?",d:"How much 问价格，单数用 is，复数用 are。",e:[["Can I help you? — I want a T-shirt.","您要买什么？——我想要一件T恤。"],["How much is it? — It's fifty yuan.","它多少钱？——五十元。"],["How much are they? — They're twenty yuan.","它们多少钱？——二十元。"]]},
   {n:"评价与试穿",d:"用 It's/They're + 形容词 评价商品；try on 试穿。",e:[["These shoes are nice. Can I try them on?","这双鞋不错，我能试穿吗？"]]}]},
  {n:"U5",en:"Farms and us",cn:"农场与我们",g:[
   {n:"What/How many...do you have?",d:"借助助动词 do 询问拥有的动物。",e:[["What animals do you have on the farm? — I have cows and sheep.","你农场里有什么动物？——我有奶牛和绵羊。"],["How many cows do you have? — I have twenty.","你有多少头奶牛？——我有二十头。"]]},
   {n:"What are these/those?",d:"these 指近处、those 指远处，回答统一用 They're...；注意名词复数（sheep 单复同形、tomato→tomatoes）。",e:[["What are these? — They're tomatoes.","这些是什么？——它们是西红柿。"],["What are those? — They're sheep.","那些是什么？——它们是绵羊。"]]}]},
  {n:"U6",en:"On the farm",cn:"在农场上",g:[
   {n:"现在进行时 What are they doing?",d:"描述正在发生的动作：be + 动词-ing。",e:[["What are they doing on the farm? — They are feeding the chickens.","他们在农场上干什么？——他们正在喂鸡。"],["Mr Wang is putting the tomatoes in boxes.","王先生正在把西红柿装箱。"]]},
   {n:"三单与 come from",d:"主语是单数/不可数时动词用三单；疑问句借助 does，后接动词原形。",e:[["Where does milk come from? — It comes from cows.","牛奶来自哪里？——它来自奶牛。"],["What do they grow on the farm? — They grow rice.","他们在农场种什么？——他们种水稻。"]]}]}
 ]}
]},
{grade:"五年级", color:"#8b5cf6", vols:[
 {title:"五年级上册", ed:"new", edLabel:"新版·2026秋", units:[
  {n:"U1",en:"Different friends",cn:"不同的朋友",g:[
   {n:"What's...like? 询问人物特征",d:"like 在这里是介词“像”，用来问外貌或性格；回答用 主语 + be + 形容词。",e:[["What's he like?","他什么样？"],["He's tall and hard-working.","他又高又勤奋。"]]},
   {n:"情态动词 can 表能力",d:"can 后接动词原形，无人称变化；否定 can't，疑问句 can 提前。",e:[["I can make a robot.","我会制作机器人。"],["Can you speak Chinese?","你会说中文吗？"]]},
   {n:"be good at + 动词-ing",d:"at 是介词，后面的动词要加 -ing，表示“擅长做某事”。",e:[["He is good at playing football.","他擅长踢足球。"],["She is good at drawing pictures.","她擅长画画。"]]}]},
  {n:"U2",en:"My feelings",cn:"我的心情",g:[
   {n:"系动词 look/feel + 形容词",d:"look（看起来）和 feel（感觉）是感官系动词，后面只能接形容词。",e:[["You look sad.","你看起来很难过。"],["We feel happy.","我们感到很开心。"]]},
   {n:"询问心情 How do you feel?",d:"关心他人情绪的句型，答语用 主语 + be + 情绪形容词。",e:[["How do you feel? — I'm worried.","你感觉怎么样？——我很担心。"],["What's the matter?","怎么了？"]]},
   {n:"Why not + 动词原形?",d:"委婉提建议的句型，后面直接接动词原形。",e:[["Why not do both?","为什么不两个都做呢？"],["Why not talk to your parents?","为什么不和父母谈谈呢？"]]}]},
  {n:"U3",en:"Work and play",cn:"学习与玩耍",g:[
   {n:"一般现在时（含三单）",d:"表示经常性动作；主语是 he/she 时动词加 -s/-es，疑问用 does（动词还原）。",e:[["What do you have on Wednesdays?","你周三有什么课？"],["She has music on Fridays.","她周五有音乐课。"]]},
   {n:"频度副词 usually/often/sometimes",d:"表示动作频率，位置在实义动词前、be 动词后。",e:[["I often play football at the weekend.","我周末经常踢足球。"],["She is sometimes shy.","她有时害羞。"]]},
   {n:"介词 on + 星期",d:"星期前用 on，首字母大写；星期加 s 表示“每周……”。",e:[["I have PE on Mondays.","我每周一有体育课。"],["We visit grandparents on Sundays.","我们每周日看望祖父母。"]]}]},
  {n:"U4",en:"Healthy habits",cn:"健康习惯",g:[
   {n:"情态动词 should/shouldn't",d:"表示“应该/不应该”，用来提健康建议，后接动词原形。",e:[["You should eat healthy food.","你应该吃健康的食物。"],["You shouldn't play on the phone so often.","你不应该这么频繁地玩手机。"]]},
   {n:"一般现在时描述习惯",d:"与 usually、every day 等连用；三单动词加 -s/-es。",e:[["I brush my teeth twice a day.","我每天刷两次牙。"],["He gets enough sleep every day.","他每天睡眠充足。"]]},
   {n:"否定祈使句 Don't...",d:"用来提醒、劝阻别人不要做某事。",e:[["Don't check your phone in bed.","不要在床上看手机。"],["Don't eat too much candy.","不要吃太多糖。"]]}]},
  {n:"U5",en:"Food we eat",cn:"我们吃的食物",g:[
   {n:"would like 想要",d:"would like + 名词/to do，语气比 want 委婉；I'd like = I would like。",e:[["What would you like to eat? — I'd like beef and rice.","你想吃什么？——我想吃牛肉和米饭。"],["Would you like some soup?","你想来点汤吗？"]]},
   {n:"可数与不可数名词",d:"rice、beef、soup 等不可数名词没有复数；表请求的问句中用 some 不用 any。",e:[["Can I have some ice cream, please?","请问我能吃点冰激凌吗？"],["Yes, but just a little.","可以，不过只能吃一点。"]]},
   {n:"come from 询问来源",d:"问事物来自哪里用 Where does...come from?，答句动词用 comes。",e:[["Where does your coconut come from?","你的椰子来自哪里？"],["It comes from Hainan.","它来自海南。"]]}]},
  {n:"U6",en:"Nature and us",cn:"自然与我们",g:[
   {n:"There be 句型（就近原则）",d:"There is + 单数/不可数，There are + 复数；多个名词并列时看最近的那个。",e:[["There is a lake in the forest.","森林里有一个湖。"],["There are many mountains in the park.","公园里有许多山。"]]},
   {n:"一般将来时 will",d:"will 后接动词原形，表示将要发生的动作或天气。",e:[["There will be heavy rain tomorrow.","明天将会有大雨。"],["It will be a fine day.","将会是个好天气。"]]},
   {n:"安全提醒 should + Don't",d:"用 should 提建议，用 Don't + 动词原形 发出警示。",e:[["You should check the weather report first.","你应该先查看天气预报。"],["Don't go hiking in bad weather.","恶劣天气不要去远足。"]]}]}
 ]},
 {title:"五年级下册", ed:"old", edLabel:"旧版参考·新版预计2027春", units:[
  {n:"U1",en:"My day",cn:"我的一天",g:[
   {n:"一般现在时（作息）",d:"用 When do you...? 询问作息，回答 I...at + 时间。",e:[["When do you get up?","你几点起床？"],["I eat breakfast at 7:00.","我七点吃早饭。"]]},
   {n:"频度副词",d:"always/usually/often/sometimes 描述活动频率。",e:[["I usually do morning exercises.","我通常做早操。"],["I often go shopping on Saturdays.","我周六常去购物。"]]}]},
  {n:"U2",en:"My favourite season",cn:"最喜欢的季节",g:[
   {n:"Which...like best? 询问最爱",d:"Which season do you like best? 问最喜欢的季节。",e:[["Which season do you like best? — Summer.","你最喜欢哪个季节？——夏天。"]]},
   {n:"because 说原因",d:"because + 句子解释喜欢的原因。",e:[["I like spring because there are beautiful flowers.","我喜欢春天，因为有美丽的花。"]]}]},
  {n:"U3",en:"My school calendar",cn:"校历",g:[
   {n:"月份与 in/on",d:"in + 月份，on + 具体日期。",e:[["When is Tree Planting Day? — It's in March.","植树节在什么时候？——在三月。"],["The party is on April 1st.","聚会在4月1日。"]]},
   {n:"will 初步（将来）",d:"will + 动词原形表示将要做某事。",e:[["I'll eat mooncakes with my family.","我将和家人吃月饼。"],["We'll have a school trip.","我们将有一次郊游。"]]}]},
  {n:"U4",en:"When is the art show?",cn:"艺术节在何时",g:[
   {n:"序数词",d:"1st/2nd/3rd 特殊，其余加 th（five→fifth，twenty→twentieth）。",e:[["My birthday is on May 5th.","我的生日是5月5日。"],["April Fool's Day is on April 1st.","愚人节在4月1日。"]]},
   {n:"日期表达",d:"on + 月份 + 序数词；回答 When is...? 用 It's on...。",e:[["When is your birthday? — It's on June 2nd.","你的生日在什么时候？——6月2日。"]]}]},
  {n:"U5",en:"Whose dog is it?",cn:"这是谁的狗",g:[
   {n:"物主代词",d:"形容词性（my/your/his）后接名词；名词性（mine/yours/his）单独使用。",e:[["Whose dog is it? — It's mine.","这是谁的狗？——是我的。"],["The book is hers.","这本书是她的。"]]},
   {n:"现在进行时引入",d:"be + 动词-ing 描述正在发生的动作。",e:[["The dog is sleeping.","狗正在睡觉。"],["The rabbit is playing with its friends.","兔子正在和朋友们玩。"]]}]},
  {n:"U6",en:"Work quietly!",cn:"安静学习",g:[
   {n:"现在进行时（巩固）",d:"be + 动词-ing；变化：直接加 ing、去 e 加 ing、双写尾字母加 ing。",e:[["What are you doing? — I'm reading a book.","你在做什么？——我在看书。"],["She is listening to music.","她正在听音乐。"]]},
   {n:"祈使句（规则）",d:"动词原形开头表命令提醒，否定加 Don't。",e:[["Talk quietly.","小声讲话。"],["Don't eat in class.","不要在课上吃东西。"]]}]}
 ]}
]},
{grade:"六年级", color:"#ef4444", vols:[
 {title:"六年级上册", ed:"old", edLabel:"旧版参考·新版预计2027秋", units:[
  {n:"U1",en:"How can I get there?",cn:"问路",g:[
   {n:"问路指路句型",d:"Where is the...? 问位置；How can I get there? 问路线；指路用 Turn left/right、Go straight。",e:[["Where is the science museum?","科学博物馆在哪里？"],["Turn left at the bookstore.","在书店左转。"]]},
   {n:"方位介词",d:"next to/near/behind/in front of 描述地点位置。",e:[["It's next to the park.","它紧挨着公园。"],["The hospital is in front of the school.","医院在学校前面。"]]}]},
  {n:"U2",en:"Ways to go to school",cn:"上学方式",g:[
   {n:"交通方式 by+交通工具",d:"by + 交通工具（无冠词），步行固定用 on foot。",e:[["I go to school by bus.","我乘公交上学。"],["Usually I come on foot.","我通常步行来。"]]},
   {n:"一般现在时三单",d:"主语是 he/she/it 时助动词用 does，动词 go→goes。",e:[["How does she go to work? — She goes by car.","她怎么上班？——开车去。"]]},
   {n:"祈使句与 must",d:"Don't + 动词原形表禁止，must 表“必须”。",e:[["Don't go at the red light.","红灯不要走。"],["You must stop and wait.","你必须停下等待。"]]}]},
  {n:"U3",en:"My weekend plan",cn:"周末计划",g:[
   {n:"一般将来时 be going to",d:"be + going to + 动词原形，表计划打算，常配 tomorrow、next week。",e:[["What are you going to do tomorrow?","你明天打算做什么？"],["I'm going to see a film.","我打算去看电影。"]]},
   {n:"be going to 句型转换",d:"否定在 be 后加 not，疑问句 be 提前。",e:[["Are you going to take a trip? — Yes, I am.","你要去旅行吗？——是的。"],["She isn't going to visit her grandma.","她不打算看望奶奶。"]]}]},
  {n:"U4",en:"I have a pen pal",cn:"笔友",g:[
   {n:"like + doing 表爱好",d:"like/hobbies 后接动词-ing 表达爱好。",e:[["What are your hobbies? — I like reading stories.","你的爱好是什么？——我喜欢读故事。"],["He likes doing kung fu.","他喜欢练功夫。"]]},
   {n:"三单疑问句 Does...?",d:"Does + 三单主语 + 动词原形。",e:[["Does he live in Sydney? — Yes, he does.","他住在悉尼吗？——是的。"],["Does she like dancing?","她喜欢跳舞吗？"]]}]},
  {n:"U5",en:"What does he do?",cn:"职业",g:[
   {n:"职业询问 What does...do?",d:"What does/do + 主语 + do? 询问职业。",e:[["What does he do? — He's a businessman.","他是做什么的？——他是商人。"],["What does your mother do?","你妈妈是做什么的？"]]},
   {n:"工作地点与方式",d:"Where does...work? / How does...go to work? 注意三单变化。",e:[["She works in a hospital.","她在医院工作。"],["He goes to work by bike.","他骑车上班。"]]}]},
  {n:"U6",en:"How do you feel?",cn:"感受",g:[
   {n:"情绪表达 feel",d:"How do/does...feel? 问感受，主语 + feel(s) + 情绪形容词。",e:[["How do you feel? — I feel happy.","你感觉怎么样？——我很开心。"],["The cat is afraid of the mouse.","猫害怕老鼠。"]]},
   {n:"should 提建议",d:"should + 动词原形表“应该”。",e:[["You should take a deep breath.","你应该深呼吸。"],["He should see a doctor.","他应该去看医生。"]]}]}
 ]},
 {title:"六年级下册", ed:"old", edLabel:"旧版参考·新版预计2028春", units:[
  {n:"U1",en:"How tall are you?",cn:"比较",g:[
   {n:"形容词比较级",d:"两者比较用 比较级 + than；规则：加 er、去 e 加 r、变 y 为 i 加 er、双写加 er。",e:[["I'm taller than you.","我比你高。"],["Your bag is heavier than mine.","你的包比我的重。"]]},
   {n:"How 引导的测量疑问句",d:"How tall/heavy/old...? 询问身高、体重、年龄。",e:[["How tall are you? — I'm 1.65 metres.","你多高？——我1.65米。"],["How heavy are you?","你多重？"]]}]},
  {n:"U2",en:"Last weekend",cn:"上周末",g:[
   {n:"一般过去时（规则动词）",d:"动词加 ed 表过去；标志词 yesterday、last weekend。",e:[["What did you do last weekend? — I cleaned my room.","你上周末做了什么？——我打扫了房间。"],["I watched TV yesterday.","我昨天看了电视。"]]},
   {n:"过去时的疑问与回答",d:"Did + 主语 + 动词原形；Yes,...did. / No,...didn't.",e:[["Did you wash your clothes? — Yes, I did.","你洗衣服了吗？——洗了。"]]}]},
  {n:"U3",en:"Where did you go?",cn:"去了哪里",g:[
   {n:"一般过去时（不规则动词）",d:"go→went、see→saw、eat→ate、ride→rode、buy→bought 等需熟记。",e:[["Where did you go? — I went to Turpan.","你去了哪里？——我去了吐鲁番。"],["We rode bikes there.","我们在那里骑了自行车。"]]},
   {n:"过去方式询问",d:"How did you go there? 问过去出行的方式。",e:[["How did you go there? — I went by plane.","你怎么去的？——坐飞机去的。"]]}]},
  {n:"U4",en:"Then and now",cn:"今昔对比",g:[
   {n:"There be 过去式",d:"There was + 单数 / There were + 复数，描述过去存在的事物。",e:[["There was no gym in my school before.","以前我们学校没有体育馆。"],["Now there is a big library.","现在有一个大图书馆。"]]},
   {n:"could/couldn't 今昔对比",d:"could 是 can 的过去式，表示过去的能力。",e:[["I couldn't ride a bike before.","我以前不会骑自行车。"],["Now I can go cycling every day.","现在我可以每天骑车。"]]}]}
 ]}
]},
{grade:"七年级", color:"#0ea5e9", vols:[
 {title:"七年级上册", ed:"new", edLabel:"新版·2024秋", units:[
  {n:"SU1",en:"Starter: Hello!",cn:"问候与字母",g:[
   {n:"问候与自我介绍",d:"26个字母书写与发音；问候语及询问姓名。",e:[["What's your name? — My name's Li Ming.","你叫什么名字？——我叫李明。"],["Nice to meet you.","很高兴认识你。"]]}]},
  {n:"SU2",en:"Starter: Keep Tidy!",cn:"学习用品与位置",g:[
   {n:"what 特殊疑问句 + be 一般疑问句",d:"What 问物品；be 动词 is/are 提前构成一般疑问句。",e:[["What do you have in your schoolbag?","你书包里有什么？"],["Is it in your schoolbag? — No, it isn't.","它在你书包里吗？——不在。"]]}]},
  {n:"SU3",en:"Starter: Welcome!",cn:"农家院与数量",g:[
   {n:"指示词 this/that/these/those",d:"近处用 this/these，远处用 that/those。",e:[["What's that? — It's a cat.","那是什么？——是一只猫。"],["What are these? — They're carrot plants.","这些是什么？——是胡萝卜苗。"]]},
   {n:"How many + 复数名词",d:"询问数量。",e:[["How many apple trees does he have?","他有多少棵苹果树？"]]}]},
  {n:"U1",en:"You and Me",cn:"你和我",g:[
   {n:"be 动词的一般现在时",d:"I 用 am，he/she/it 及单数用 is，you/we/they 及复数用 are；否定在 be 后加 not，疑问把 be 提到句首。",e:[["I am a student.","我是一名学生。"],["She is my good friend.","她是我的好朋友。"],["Are you in Class 1? — Yes, I am.","你在一班吗？——是的。"]]},
   {n:"人称代词与形容词性物主代词",d:"主格（I/you/he/she/it/we/they）作主语；my/your/his/her/its/our/their 后接名词表所属。",e:[["His name is Peter.","他的名字叫彼得。"],["This is our English teacher.","这是我们的英语老师。"]]}]},
  {n:"U2",en:"We're Family!",cn:"我们是一家人",g:[
   {n:"实义动词的一般现在时",d:"三单动词加 -s/-es（have→has）；疑问与否定借助 do/does，does 后动词还原。",e:[["She has a ping-pong bat.","她有一只乒乓球拍。"],["Does your father like sport? — Yes, he does.","你爸爸喜欢运动吗？——是的。"],["They don't watch TV every day.","他们不是每天看电视。"]]},
   {n:"名词所有格 -'s",d:"单数名词加 's；以 s 结尾的复数只加 '；共同拥有在最后一个人名后加 's。",e:[["This is Teng Fei's grandpa.","这是腾飞的爷爷。"],["These are my parents' books.","这些是我父母的书。"]]}]},
  {n:"U3",en:"My School",cn:"我的学校",g:[
   {n:"there be 句型",d:"There is/are + 名词 + 地点；is 接单数或不可数，are 接复数；遵循就近原则。",e:[["There is a library in our school.","我们学校有一个图书馆。"],["There are 40 students in my class.","我班有40名学生。"],["Is there a gym? — Yes, there is.","有体育馆吗？——有。"]]},
   {n:"方位介词（短语）",d:"in front of、behind、between...and...、next to、across from 描述位置。",e:[["The dining hall is behind the classroom building.","餐厅在教学楼后面。"],["The library is next to the sports field.","图书馆紧挨着运动场。"]]}]},
  {n:"U4",en:"My Favourite Subject",cn:"最喜欢的学科",g:[
   {n:"连词 and/but/because",d:"and 表并列“和”，but 表转折“但是”，because 表原因“因为”，回答 why 问句。",e:[["I like English and maths.","我喜欢英语和数学。"],["History is difficult but interesting.","历史难但有趣。"],["I like PE because it's exciting.","我喜欢体育，因为它令人兴奋。"]]}]},
  {n:"U5",en:"Fun Clubs",cn:"有趣的社团",g:[
   {n:"情态动词 can 表能力",d:"can + 动词原形，不随人称变化；否定 can't；疑问 Can 提句首。",e:[["I can play the guitar.","我会弹吉他。"],["Can you swim? — No, I can't.","你会游泳吗？——不会。"],["She can't dance, but she can sing.","她不会跳舞，但会唱歌。"]]}]},
  {n:"U6",en:"A Day in the Life",cn:"生活中的一天",g:[

/* ================= 渲染逻辑 ================= */
let curG = 0, curV = 0, keyword = "";
const $ = s => document.querySelector(s);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function hl(s){
  s = esc(s);
  if(!keyword) return s;
  const k = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return s.replace(new RegExp("("+k+")","gi"),"<mark>$1</mark>");
}

function renderGrades(){
  $("#grades").innerHTML = DATA.map((g,i)=>
    `<div class="gpill ${i===curG?"on":""}" style="${i===curG?`background:${g.color};border-color:${g.color};box-shadow:0 4px 12px ${g.color}55`:""}" onclick="pickGrade(${i})">${g.grade}</div>`
  ).join("");
}
function renderVols(){
  const g = DATA[curG];
  $("#vols").innerHTML = g.vols.map((v,i)=>
    `<div class="vtab ${i===curV?"on":""}" style="${i===curV?`border-color:${g.color};background:${g.color}14`:""}" onclick="pickVol(${i})">
      <div class="t">${v.title}</div>
      <div class="s"><span class="badge ${v.ed}">${v.ed==="new"?"新版教材":"旧版参考"}</span> <span style="color:var(--sub)">${v.edLabel}</span></div>
    </div>`
  ).join("");
}
function match(u){
  if(!keyword) return true;
  const k = keyword.toLowerCase();
  return (u.en+u.cn).toLowerCase().includes(k) ||
    u.g.some(p => p.n.toLowerCase().includes(k) || p.d.toLowerCase().includes(k) ||
      p.e.some(x => x[0].toLowerCase().includes(k) || x[1].includes(keyword)));
}

function renderMain(){
  const g = DATA[curG], v = g.vols[curV];
  const units = v.units.filter(match);
  let totalG = v.units.reduce((s,u)=>s+u.g.length,0);
  let html = "";
  if(v.ed==="old"){
    html += `<div class="notice">⚠️ 本册 2024 教改新版教材尚未发行，以下内容为现行旧版教材语法整理，供过渡参考；新版发行后建议更新。</div>`;
  }
  html += `<div class="toolbar">
    <span class="stat">${v.title} ｜ ${v.units.length} 个单元 · ${totalG} 个语法点${keyword?` ｜ 命中 ${units.length} 个单元`:""}</span>
    <span>
      <button onclick="toggleAll(true)">全部展开</button>
      <button onclick="toggleAll(false)">全部收起</button>
    </span>
  </div>`;
  // 语法点总览 chips
  html += `<div class="overview">` + v.units.map((u,i)=>
    u.g.map(p=>`<span class="chip" onclick="jump(${i})" title="${esc(u.n+" "+u.en)}">${esc(p.n.split(/[（(：:]/)[0])}</span>`).join("")
  ).join("") + `</div>`;

  if(!units.length){
    html += `<div class="empty">没有找到匹配「${esc(keyword)}」的内容，换个关键词试试～</div>`;
  }
  units.forEach((u)=>{
    const idx = v.units.indexOf(u);
    html += `<div class="unit ${keyword?"open":""}" id="unit${idx}">
      <div class="unit-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="unit-num" style="background:${g.color}1a;color:${g.color}">${u.n}</div>
        <div class="unit-title">
          <div class="en">${hl(u.en)}</div>
          <div class="cn">${hl(u.cn)}</div>
        </div>
        <span class="unit-count">${u.g.length} 个语法点</span>
        <span class="arrow">▶</span>
      </div>
      <div class="unit-body">
        <div class="tree">
          <div class="root"><span style="background:linear-gradient(135deg,${g.color},${g.color}bb)">${u.n} · ${esc(u.en)}</span></div>
          <div class="branches" style="--c:${g.color}">
          ${u.g.map(p=>`
            <div class="gnode">
              <div class="gname" style="color:${g.color}">${hl(p.n)}</div>
              <div class="gdesc">${hl(p.d)}</div>
              ${p.e.map(x=>`<div class="ex"><div class="en">${hl(x[0])}</div><div class="cn">${hl(x[1])}</div></div>`).join("")}
            </div>`).join("")}
          </div>
        </div>
      </div>
    </div>`;
  });
  $("#main").innerHTML = html;
}

function pickGrade(i){ curG=i; curV=0; renderGrades(); renderVols(); renderMain(); window.scrollTo({top:0}); }
function pickVol(i){ curV=i; renderVols(); renderMain(); }
function onSearch(v){ keyword=v.trim(); renderMain(); if(keyword) document.querySelectorAll(".unit").forEach(u=>u.classList.add("open")); }
function toggleAll(open){ document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("open",open)); }
function jump(i){
  const el = document.getElementById("unit"+i);
  if(el){ el.classList.add("open"); el.scrollIntoView({behavior:"smooth",block:"start"}); }
}

renderGrades(); renderVols(); renderMain();
</script>
