<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小初英语学习 · 知识结构图</title>
<style>
:root{
  --bg:#f5f7fa;
  --text:#1e293b;
  --text2:#64748b;
  --text3:#94a3b8;
  --card:#fff;
  --line:#c7d9e8;
  --radius:16px;
  --shadow:0 2px 16px rgba(15,23,42,.06);
  --grad:linear-gradient(135deg,#35d29a,#2f9df0);
  --primary:#2e9e6b;
  --primary-d:#0f6b4c;
  --hot:#e53935;
  --hot-bg:#fef2f2;
  --gray-bg:#f1f5f9;
  --c-blue:#2f9df0;
  --c-green:#2e9e6b;
  --c-indigo:#6366f1;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:820px;width:100%;padding:24px 18px 0;flex:1;}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--grad);border-radius:22px;
  padding:26px 24px 22px;color:#fff;
  box-shadow:0 10px 30px rgba(47,157,240,.25);
  margin-bottom:16px;text-align:center;
}
.hero-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none;}
.hero-deco.d1{width:170px;height:170px;top:-70px;right:-40px;}
.hero-deco.d2{width:96px;height:96px;bottom:-46px;right:52px;background:rgba(255,255,255,.09);}
.hero-tag{
  position:relative;display:inline-block;
  font-size:11.5px;font-weight:700;letter-spacing:.14em;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
  padding:3px 11px;border-radius:999px;margin-bottom:12px;
}
.hero h1{position:relative;font-size:1.85rem;font-weight:800;letter-spacing:.06em;line-height:1.25;}
.hero-core{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  margin-top:10px;font-size:.92rem;font-weight:600;letter-spacing:.04em;
}
.hero-core .ck{
  font-size:11px;font-weight:800;letter-spacing:.1em;
  background:#fff;color:var(--primary-d);
  padding:2px 8px;border-radius:999px;
}
.hero-stats{
  position:relative;display:flex;align-items:center;justify-content:center;
  gap:10px;flex-wrap:wrap;
  margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.92);
}
.hero-stats b{font-size:15px;font-weight:800;}
.hero-stats .sep{width:1px;height:12px;background:rgba(255,255,255,.45);}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.search{
  flex:1;min-width:190px;position:relative;display:flex;align-items:center;
  background:#fff;border:2px solid #e2e8f0;border-radius:999px;
  padding:0 14px;transition:border-color .2s;
}
.search:focus-within{border-color:var(--primary);}
.search .si{font-size:14px;opacity:.5;margin-right:8px;line-height:1;}
.search input{
  flex:1;border:none;outline:none;background:transparent;
  font-family:inherit;font-size:14px;color:var(--text);
  padding:10px 0;min-width:0;
}
.search input::-webkit-search-cancel-button{display:none;}
.qclear{
  border:none;background:var(--gray-bg);color:var(--text2);
  width:20px;height:20px;border-radius:50%;line-height:1;font-size:14px;
  cursor:pointer;flex:0 0 auto;
}
.btns{display:flex;gap:8px;}
.btn{
  font-family:inherit;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:999px;cursor:pointer;
  border:1.5px solid #dbe7f1;background:#fff;color:var(--text2);
  transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn:active{transform:scale(.96);}
.btn.solid{
  background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 4px 14px rgba(46,158,107,.28);
}
.btn.solid:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff;}

/* ---------- Tree card ---------- */
.tree-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px 18px;
}
.tree,.tree ul{list-style:none;margin:0;padding:0;}
.tree > li + li{margin-top:6px;}

li{position:relative;}
.tree ul{padding-left:22px;}
.tree ul > li{padding-left:18px;}
.tree ul > li::before{
  content:"";position:absolute;left:0;top:0;height:100%;
  border-left:1.5px solid var(--line);
}
.tree ul > li:last-child::before{height:17px;}
.tree ul > li::after{
  content:"";position:absolute;left:0;top:17px;width:18px;
  border-top:1.5px solid var(--line);
}

/* 节点行 */
.nd{
  display:flex;align-items:center;gap:8px;min-height:34px;
  border-radius:10px;padding:2px 8px 2px 2px;
  transition:background .15s;
}
.nd:hover{background:#f8fbff;}
.tw{
  flex:0 0 auto;width:20px;height:20px;
  display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;
  color:var(--text3);font-size:11px;line-height:1;
  border-radius:6px;transition:transform .18s,color .15s,background .15s;
  font-family:inherit;
}
.tw:hover{background:var(--gray-bg);color:var(--text2);}
.nd[aria-expanded="false"] .tw{transform:rotate(-90deg);}
.tw.leaf{visibility:hidden;}

.tx{font-size:14.5px;font-weight:600;color:var(--text);line-height:1.4;}
.note{
  font-size:12.5px;color:var(--text2);font-weight:500;line-height:1.4;
  letter-spacing:.01em;
}
.note::before{content:"·";margin-right:5px;opacity:.55;}
.tag{
  font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:1.5px 7px;border-radius:999px;
  background:var(--gray-bg);color:var(--text2);
  flex:0 0 auto;
}
.tag.hot{background:var(--hot-bg);color:var(--hot);}

/* 一级分支 */
.br{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;}
.br .ic{font-size:17px;line-height:1;}
.br .tx{font-size:16px;font-weight:800;letter-spacing:.04em;}
.br .cnt{
  margin-left:auto;font-size:11.5px;font-weight:700;color:#fff;
  padding:2px 9px;border-radius:999px;
}
li.C-blue   > .nd.br{background:#eff8ff;}
li.C-blue   > .nd.br .cnt{background:var(--c-blue);}
li.C-blue   > .nd.br .tx{color:#12659f;}
li.C-green  > .nd.br{background:#ecfaf4;}
li.C-green  > .nd.br .cnt{background:var(--c-green);}
li.C-green  > .nd.br .tx{color:var(--primary-d);}
li.C-indigo > .nd.br{background:#eef0fe;}
li.C-indigo > .nd.br .cnt{background:var(--c-indigo);}
li.C-indigo > .nd.br .tx{color:#4338ca;}

/* 折叠 */
.nd[aria-expanded="false"] + ul{display:none;}

/* 搜索 */
.nd.dim{opacity:.32;}
.nd.hit > .tx{color:var(--hot);}
.nd.hit{background:#fff8f8;}
mark{background:#fff2b8;color:inherit;border-radius:3px;padding:0 1px;}

/* 图例 */
.legend{
  display:flex;flex-wrap:wrap;gap:8px 16px;
  margin-top:14px;padding:12px 16px;
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  font-size:12px;color:var(--text2);
}
.legend i{
  display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:6px;vertical-align:middle;
}
/* ---------- 视频导播栏 ---------- */
.vid-nav{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 16px 14px;margin-top:14px;
}
.vid-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.vid-head .vh-ic{font-size:17px;line-height:1;}
.vid-head h2{font-size:16px;font-weight:800;letter-spacing:.04em;color:var(--text);}
.vid-head .vh-cnt{
  margin-left:auto;font-size:11.5px;font-weight:700;color:#fff;
  background:var(--primary);padding:2px 9px;border-radius:999px;
}
.vid-list{display:grid;grid-template-columns:1fr;gap:8px;}
.vid-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-family:inherit;cursor:pointer;text-decoration:none;
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:11px 13px;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;
}
.vid-item:hover{background:#fff;border-color:var(--primary);box-shadow:0 4px 14px rgba(46,158,107,.14);transform:translateY(-1px);}
.vid-item:active{transform:scale(.985);}
.vid-item .vi-no{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--grad);
  color:#fff;font-size:11.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;
}
.vid-item .vi-tx{
  flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.vid-item .vi-go{flex:0 0 auto;font-size:12px;color:var(--primary);line-height:1;}
@media (min-width:620px){.vid-list{grid-template-columns:1fr 1fr;}}

/* 返回主页按钮（照 daily_practice.html，色令牌用本页 --primary） */
.back-wrap{text-align:center;width:100%;max-width:820px;margin:18px 0 0;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 22px;background:#fff;color:var(--primary-d);
  border:1.5px solid var(--primary);border-radius:14px;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 4px 12px rgba(46,158,107,.12);
  transition:transform .15s,box-shadow .15s;
}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(46,158,107,.2);}
.back-btn:active{transform:scale(.97);}

/* 页脚 */
.site-footer{
  text-align:center;padding:18px 0 22px;width:100%;max-width:820px;
  color:var(--text3);font-size:.75rem;
  border-top:1px solid #e2e8f0;margin-top:20px;
}
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.coach-tip .tip{
  visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;
  transform:translateX(-50%) translateY(4px);
  background:var(--grad);color:#fff;padding:7px 14px;border-radius:10px;
  font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;
  z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);
  transition:opacity .2s ease,transform .2s ease,visibility .2s;
}
.coach-tip .tip::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#2f9df0;
}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{
  visibility:visible;opacity:1;transform:translateX(-50%) translateY(0);
}

@media (max-width:520px){
  .container{padding:14px 12px 0;}
  .hero{border-radius:18px;padding:22px 18px 18px;}
  .hero h1{font-size:1.5rem;}
  .hero-stats{font-size:11.5px;gap:8px;}
  .tree-card{padding:10px 10px 14px;}
  .tree ul{padding-left:16px;}
  .tree ul > li{padding-left:14px;}
  .tree ul > li::after{width:14px;}
  .tx{font-size:13.5px;}
  .note{font-size:11.5px;display:block;margin-left:0;margin-top:1px;}
  .nd{flex-wrap:wrap;gap:4px 8px;}
  .br .tx{font-size:15px;}
  .btn{padding:8px 13px;font-size:12.5px;}
}
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <div class="hero-deco d1"></div>
    <div class="hero-deco d2"></div>
    <div class="hero-tag">思维导图</div>
    <h1>英语语法知识体系</h1>
    <div class="hero-core"><span class="ck">英语学习的核心是句子</span></div>
    <div class="hero-stats">
      <span><b>3</b> 大板块</span>
      <span class="sep"></span>
      <span><b id="statNodes">—</b> 个知识点</span>
      <span class="sep"></span>
      <span><b>6</b> 大必考时态</span>
      <span class="sep"></span>
      <span><b>3</b> 大从句</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <span class="si">🔍</span>
      <input id="q" type="search" placeholder="搜索知识点，如「时态」「从句」「音标」" autocomplete="off">
      <button id="qClear" class="qclear" hidden aria-label="清除">×</button>
    </div>
    <div class="btns">
      <button class="btn solid" id="expandAll">展开全部</button>
      <button class="btn" id="collapseAll">折叠全部</button>
    </div>
  </div>

  <main class="tree-card">
    <ul class="tree" id="tree"></ul>
  </main>

  <div class="legend">
    <span><i style="background:var(--c-blue)"></i>单词</span>
    <span><i style="background:var(--c-green)"></i>固定短语</span>
    <span><i style="background:var(--c-indigo)"></i>语法</span>
    <span><i style="background:var(--hot)"></i>初中重中之重</span>
    <span><i style="background:var(--text3)"></i>初中看懂即可</span>
  </div>

  <section class="vid-nav" aria-label="视频导播">
    <div class="vid-head">
      <span class="vh-ic">🎬</span>
      <h2>视频讲解</h2>
      <span class="vh-cnt" id="vidCnt">0</span>
    </div>
    <div class="vid-list" id="vidList"></div>
  </section>

</div>

<div class="back-wrap"><a href="index.html" class="back-btn">🏠 返回主页</a></div>
<footer class="site-footer">&copy; 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span></footer>

<script>
/* ==========================================================================
 * 数据区：整棵知识树集中在此维护
 *   name  节点名称
 *   note  补充说明（节点右侧灰字）
 *   tip   灰色小标签（如「初中看懂即可」）
 *   hot   红色高亮（初中重中之重）
 *   kids  子节点
 * ========================================================================== */
var DATA = [
  { name:'单词', icon:'🔤', color:'blue', kids:[
    { name:'48国际音标' },
    { name:'自然拼读规则' },
    { name:'十大词性', kids:[
      { name:'名词n.', kids:[
        { name:'5种基本形式', kids:[
            { name:'原形 do', note:'to do 不变形，只是不定式结构' },
            { name:'三单 does' },
            { name:'过去式 did' },
            { name:'现在分词 doing' },
            { name:'过去分词 done' }
          ]},
        { name:'形容词+名词', kids:[
          ]}
      ]},
      { name:'动词v.', kids:[
        { name:'16种时态', kids:[
          { name:'初中必考六大时态', kids:[
            { name:'一般现在时' },
            { name:'一般过去时' },
            { name:'一般将来时' },
            { name:'现在进行时' },
            { name:'现在完成时' },
            { name:'过去进行时' }
          ]}
        ]},
        { name:'动词+副词' }
      ]},
      { name:'形容词adj.' },
      { name:'副词adv.', note:'形容词与副词的关联，如 happy 与 happily' },
      { name:'介词prep.' },
	  { name:'代词pron.' },
	  { name:'冠词art.' },
 	  { name:'数词num.' },
	  { name:'连词conj.' },
      { name:'感叹词interj.' }
    ]}
  ]},

  { name:'固定短语', icon:'🧩', color:'green', kids:[] },

  { name:'语法', icon:'📖', color:'indigo', kids:[
    { name:'简单句：两大结构', kids:[
      { name:'主动结构', kids:[
        { name:'两大基本句型', kids:[
          { name:'有动作：主谓宾', kids:[
            { name:'主谓', note:'省略主语：祈使句' },
            { name:'主谓宾', kids:[
              { name:'主语', note:'定语+主语' },
              { name:'谓语', note:'谓语+状语 → 方+地+时' },
              { name:'宾语', note:'定语+宾语' }
            ]},
            { name:'主谓宾宾', kids:[
              { name:'间接宾语' },
              { name:'直接宾语' }
            ]},
            { name:'主谓宾补' }
          ]},
          { name:'无动作：主系表', kids:[
            { name:'特殊（表存在）：There be 句型', kids:[
              { name:'There 作形式主语' }
            ]}
          ]}
        ]}
      ]},
      { name:'被动结构' }
    ]},
    { name:'并列句' },
    { name:'复合句：三大从句', kids:[
      { name:'名词性从句', kids:[
        { name:'宾语从句', hot:true, note:'初中重中之重' },
        { name:'主语从句' },
        { name:'表语从句' },
        { name:'同位语从句' }
      ]},
      { name:'定语从句', kids:[
        { name:'形容词性从句', kids:[
          { name:'非限制性定语从句' },
          { name:'限制性定语从句' }
        ]}
      ]},
      { name:'状语从句', kids:[
        { name:'时间状语从句', note:'when / while / before / after / until / as soon as' },
        { name:'条件状语从句', note:'if' },
        { name:'原因状语从句', note:'because' },
        { name:'让步状语从句', note:'though / although' },
        { name:'结果状语从句', note:'so...that...' },
        { name:'目的状语从句', note:'so that' },
        { name:'比较状语从句', note:'than' },
        { name:'地点状语从句', note:'where', tip:'初中看懂即可' },
        { name:'方式状语从句', note:'as', tip:'初中看懂即可' }
      ]}
    ]}
  ]}
];

/* ==========================================================================
 * 视频导播配置：name 显示名（取视频文件名）· file 同目录播放页
 * ========================================================================== */
var VIDEOS = [
  { name:'一个苹果教你秒懂英语9大词性', file:'v-pos9.html' },
  { name:'一分钟让你秒懂英语语法体系',  file:'v-system.html' },
  { name:'英语五大基本句型（雪梨版）',  file:'v-sentence5.html' },
  { name:'三大句型（红楼版）',         file:'v-pattern3.html' },
  { name:'初中八大时态',              file:'v-tense8.html' },
  { name:'16大时态（红楼版）',        file:'v-tense16.html' }
];

/* ==========================================================================
 * 渲染
 * ========================================================================== */
var treeEl = document.getElementById('tree');
var total = 0;

function countNodes(n){
  total++;
  if (n.kids) for (var i=0;i<n.kids.length;i++) countNodes(n.kids[i]);
}
for (var t=0;t<DATA.length;t++) countNodes(DATA[t]);
document.getElementById('statNodes').textContent = total;

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}

function codeOf(n){ return (n.name||'') + ' ' + (n.note||'') + ' ' + (n.tip||''); }

function buildNode(n, isBranch){
  var li = document.createElement('li');
  var hasKids = !!(n.kids && n.kids.length);
  if (isBranch && n.color) li.className = 'C-' + n.color;

  var nd = document.createElement('div');
  nd.className = isBranch ? 'nd br' : 'nd';
  nd.setAttribute('aria-expanded', 'true');

  var tw = document.createElement('button');
  tw.type = 'button';
  tw.className = hasKids ? 'tw' : 'tw leaf';
  tw.textContent = '▾';
  if (hasKids) tw.setAttribute('aria-label', '展开或折叠 ' + n.name);
  nd.appendChild(tw);

  if (isBranch){
    var ic = document.createElement('span');
    ic.className = 'ic';
    ic.textContent = n.icon || '';
    nd.appendChild(ic);
  }

  var tx = document.createElement('span');
  tx.className = 'tx';
  tx.textContent = n.name;
  nd.appendChild(tx);

  if (n.note){
    var nt = document.createElement('span');
    nt.className = 'note';
    nt.textContent = n.note;
    nd.appendChild(nt);
  }
  if (n.tip){
    var tg = document.createElement('span');
    tg.className = 'tag';
    tg.textContent = n.tip;
    nd.appendChild(tg);
  }
  if (n.hot){
    var hb = document.createElement('span');
    hb.className = 'tag hot';
    hb.textContent = '重点';
    nd.appendChild(hb);
  }
  if (isBranch && hasKids){
    var ct = document.createElement('span');
    ct.className = 'cnt';
    var c = 0;
    (function walk(list){ for (var i=0;i<list.length;i++){ c++; if (list[i].kids) walk(list[i].kids); } })(n.kids);
    ct.textContent = c;
    nd.appendChild(ct);
  }

  if (hasKids){
    tw.addEventListener('click', function(e){
      e.stopPropagation();
      var open = nd.getAttribute('aria-expanded') === 'true';
      nd.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
    nd.addEventListener('click', function(){
      nd.setAttribute('aria-expanded', nd.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    });
  }

  li.appendChild(nd);

  if (hasKids){
    var ul = document.createElement('ul');
    for (var i=0;i<n.kids.length;i++) ul.appendChild(buildNode(n.kids[i], false));
    li.appendChild(ul);
  }
  return li;
}

for (var b=0;b<DATA.length;b++) treeEl.appendChild(buildNode(DATA[b], true));

/* ==========================================================================
 * 展开 / 折叠
 * ========================================================================== */
function setAll(open){
  var nds = treeEl.querySelectorAll('.nd');
  for (var i=0;i<nds.length;i++){
    var nd = nds[i];
    var next = nd.nextElementSibling;
    if (next && next.tagName === 'UL') nd.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
}
document.getElementById('expandAll').addEventListener('click', function(){ clearSearch(); setAll(true); });
document.getElementById('collapseAll').addEventListener('click', function(){
  clearSearch();
  var nds = treeEl.querySelectorAll('.nd');
  for (var i=0;i<nds.length;i++){
    var nd = nds[i];
    var next = nd.nextElementSibling;
    if (next && next.tagName === 'UL'){
      var lv = nd.closest('.tree > li') && nd.parentElement.parentElement === treeEl;
      nd.setAttribute('aria-expanded', lv ? 'true' : 'false');
    }
  }
});

/* ==========================================================================
 * 搜索
 * ========================================================================== */
var qEl = document.getElementById('q');
var qClear = document.getElementById('qClear');

function clearSearch(){
  qEl.value = '';
  qClear.hidden = true;
  var all = treeEl.querySelectorAll('.nd');
  for (var i=0;i<all.length;i++){
    all[i].classList.remove('dim','hit');
    var tx = all[i].querySelector('.tx');
    if (tx && tx.dataset.raw) tx.innerHTML = esc(tx.dataset.raw);
  }
  var lis = treeEl.querySelectorAll('li');
  for (var j=0;j<lis.length;j++) lis[j].style.display = '';
}

function doSearch(kw){
  var q = kw.trim().toLowerCase();
  if (!q){ clearSearch(); return; }

  var lis = treeEl.querySelectorAll('li');
  for (var j=0;j<lis.length;j++) lis[j].style.display = 'none';

  function markEl(el, raw){
    var low = raw.toLowerCase(), idx = low.indexOf(q);
    if (idx < 0) return false;
    el.innerHTML = esc(raw.slice(0, idx)) + '<mark>' + esc(raw.slice(idx, idx + q.length)) + '</mark>' + esc(raw.slice(idx + q.length));
    return true;
  }

  function walk(li){
    var nd = li.querySelector(':scope > .nd');
    if (!nd) return false;
    var tx = nd.querySelector('.tx');
    var raw = tx.dataset.raw || tx.textContent;
    if (!tx.dataset.raw) tx.dataset.raw = raw;
    var hit = codeOf({ name: raw }).toLowerCase().indexOf(q) > -1;
    var noteEl = nd.querySelector('.note');
    if (noteEl && noteEl.textContent.toLowerCase().indexOf(q) > -1) hit = true;
    var tipEl = nd.querySelector('.tag');
    if (tipEl && tipEl.textContent.toLowerCase().indexOf(q) > -1) hit = true;

    var childUl = li.querySelector(':scope > ul');
    var childHit = false;
    if (childUl){
      var kids = childUl.children;
      for (var i=0;i<kids.length;i++){ if (walk(kids[i])) childHit = true; }
    }

    if (hit || childHit){
      li.style.display = '';
      if (hit){
        nd.classList.add('hit');
        markEl(tx, raw);
        if (childUl) nd.setAttribute('aria-expanded', 'true');
      }
      return true;
    }
    return false;
  }

  for (var b=0;b<treeEl.children.length;b++){
    var li0 = treeEl.children[b];
    var ok = walk(li0);
    if (ok){
      li0.style.display = '';
      var nd0 = li0.querySelector(':scope > .nd');
      if (nd0) nd0.setAttribute('aria-expanded', 'true');
    }
  }
}

qEl.addEventListener('input', function(){
  qClear.hidden = !qEl.value;
  doSearch(qEl.value);
});
qClear.addEventListener('click', function(){ clearSearch(); qEl.focus(); });

/* ==========================================================================
 * 视频导播栏
 * ========================================================================== */
var vidListEl = document.getElementById('vidList');
document.getElementById('vidCnt').textContent = VIDEOS.length;

/* 弹窗打开播放页；弹窗被拦时返回 true，交给锚点自身默认行为（新标签） */
function openVideo(i){
  var f = VIDEOS[i].file;
  var sw = screen.availWidth  || window.innerWidth  || 1024;
  var sh = screen.availHeight || window.innerHeight || 768;
  var w = Math.min(960, Math.floor(sw * 0.92));
  var h = Math.min(620, Math.floor(sh * 0.88));
  var left = Math.floor((sw - w) / 2);
  var top = Math.floor((sh - h) / 2);
  var win = null;
  try{
    win = window.open(f, 'gv' + i,
      'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
      ',resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
  }catch(e){ win = null; }
  return !win;
}

for (var vi=0; vi<VIDEOS.length; vi++){
  (function(i){
    var a = document.createElement('a');
    a.className = 'vid-item';
    a.href = VIDEOS[i].file;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', '播放 ' + VIDEOS[i].name);

    var no = document.createElement('span');
    no.className = 'vi-no';
    no.textContent = i + 1;

    var tx = document.createElement('span');
    tx.className = 'vi-tx';
    tx.textContent = VIDEOS[i].name;

    var go = document.createElement('span');
    go.className = 'vi-go';
    go.textContent = '▶';

    a.appendChild(no); a.appendChild(tx); a.appendChild(go);
    a.addEventListener('click', function(ev){
      if (!openVideo(i)) ev.preventDefault();
    });
    vidListEl.appendChild(a);
  })(vi);
}
