<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>元音组合表格 · 背单词神器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#2ebd85;--green-deep:#1fa873;--blue:#2f9df0;--text:#33434b;
  --text-light:#8aa09a;--card:#ffffff;--shadow:0 8px 22px rgba(47,157,240,.10);--radius:16px;
  --bad:#e0574f;--line:#e6f1ec;
}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
  color:var(--text);line-height:1.9;min-height:100vh;
  display:flex;justify-content:center;padding:24px 16px calc(40px + env(safe-area-inset-bottom));
}
.container{width:100%;max-width:760px;}

/* ---------- 标题卡 ---------- */
.title-card{
  position:relative;width:100%;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
  border-radius:22px;padding:30px 20px 24px;text-align:center;color:#fff;overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25);
}
.title-card::before,.title-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);}
.title-card::before{width:120px;height:120px;top:-40px;right:-30px;}
.title-card::after{width:70px;height:70px;bottom:-24px;left:-16px;}
.title-card h1{position:relative;font-size:23px;letter-spacing:2px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.12);}
.title-card .sub{position:relative;margin-top:10px;font-size:13px;letter-spacing:3px;opacity:.94;}
.title-card .meta{position:relative;margin-top:12px;font-size:12px;opacity:.88;letter-spacing:1px;}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.video-btn{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  padding:12px 26px;background:rgba(255,255,255,.95);color:var(--green-deep);
  border:none;border-radius:999px;font-size:15px;font-weight:700;
  box-shadow:0 6px 18px rgba(255,255,255,.4);cursor:pointer;font-family:inherit;
  transition:transform .15s, box-shadow .15s;text-decoration:none;
}
.video-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,255,255,.5)}
.video-btn:active{transform:scale(.97)}
.video-btn .play-ico{font-size:18px}

/* ---------- 吸顶工具栏 ---------- */
.toolbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(47,157,240,.14);
}
.btn{
  border:0;font-family:inherit;font-size:13.5px;font-weight:700;border-radius:999px;
  padding:9px 18px;cursor:pointer;transition:transform .15s;white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;box-shadow:0 4px 12px rgba(47,157,240,.28)}
.btn-ghost{background:#fff;color:var(--green-deep);border:1.5px solid #cdeee0}
.btn-plain{background:#f2f7f5;color:#5d7a72}
.stat{margin-left:auto;font-size:13px;color:var(--text-light);font-weight:600;white-space:nowrap}
.stat b{color:var(--green-deep);font-size:16px;font-variant-numeric:tabular-nums}

/* ---------- 判分结果 ---------- */
.result{display:none;margin-top:12px;padding:11px 16px;border-radius:12px;
  font-size:13.5px;font-weight:700;text-align:center;line-height:1.7}
.result.on{display:block}
.result.good{background:#e8f9f1;color:#1a9c6b;box-shadow:inset 0 0 0 1.5px #35d29a}
.result.warn{background:#fdeeed;color:#c9413a;box-shadow:inset 0 0 0 1.5px #f0a9a4}

/* ---------- 表格卡 ---------- */
.sec{background:#fff;border-radius:var(--radius);padding:20px 20px 16px;margin-top:18px;box-shadow:var(--shadow);}
.sec h2{font-size:17px;color:#2f6ba3;display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8f2ec;}
.sec h2 .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;font-size:14px;flex-shrink:0;}
.sec .hint{font-size:12px;color:var(--text-light);font-weight:400;margin-left:auto;letter-spacing:0}

.tw{border:1.5px solid #d9ebe3;border-radius:12px;overflow:hidden;background:#fff}
.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
.grid tr > *:last-child{border-right:0}
.grid tr:last-child > *{border-bottom:0}
.grid th{height:32px;background:#f2fbf7;color:var(--green-deep);font-weight:700;font-size:13.5px}
.grid th:first-child{width:38px}
.grid .corner{
  background-color:#f2fbf7;
  background-image:linear-gradient(to bottom right,transparent calc(50% - 1px),#bcdcd0 calc(50% - 1px),#bcdcd0 calc(50% + 1px),transparent calc(50% + 1px));
}
.grid td{height:40px;background:#fcfffe}
.grid td.na{background:#f7faf9;color:#ccd9d4;font-size:15px}
.grid input{
  width:100%;height:38px;border:0;outline:0;background:transparent;
  text-align:center;font-family:inherit;font-size:16px;font-weight:700;color:var(--green-deep);
  border-radius:8px;transition:background .15s, box-shadow .15s;
}
.grid input:focus{background:#eafaf3;box-shadow:inset 0 0 0 1.5px var(--green)}
.grid td.ok input{color:#1a9c6b;background:#e8f9f1;box-shadow:inset 0 0 0 1.5px #35d29a}
.grid td.bad input{color:#c9413a;background:#fdeeed;box-shadow:inset 0 0 0 1.5px #f0a9a4}
.grid td.show input{color:#2f6ba3;background:#eef5fd;box-shadow:inset 0 0 0 1.5px #a8cdf0}

/* 表3 / 表4 并排 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.duo .sec{margin-top:0;padding:18px 14px 14px}
.duo .sec h2{font-size:14.5px;margin-bottom:12px;padding-bottom:9px}
.duo .sec h2 .no{width:22px;height:22px;border-radius:7px;font-size:12px}
.duo .grid th:first-child{width:34px}

/* ---------- 说明 ---------- */
.tips{background:#fff;border-radius:var(--radius);padding:20px 20px 16px;margin-top:18px;box-shadow:var(--shadow);}
.tips h2{font-size:16px;color:#2f6ba3;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #e8f2ec;}
.tips li{list-style:none;font-size:14px;color:#4a5a63;padding:7px 0 7px 26px;position:relative}
.tips li .dot{position:absolute;left:6px;top:14px;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#35d29a,#2f9df0)}
.tips li b{color:var(--green-deep)}
.tips .tag{display:inline-block;padding:3px 10px;background:#eefaf4;border:1px solid #cdeee0;border-radius:8px;font-size:12.5px;color:#2f6ba3;font-weight:600;margin:2px 3px}

/* ---------- 返回 / 页脚 ---------- */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:11px 26px;
  background:#fff;color:var(--green-deep);border:1.5px solid var(--green);border-radius:14px;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 4px 12px rgba(46,158,107,.12);transition:transform .15s;
}
.back-btn:active{transform:scale(.97)}
.back-wrap{text-align:center;margin:24px 0 6px}
footer{text-align:center;font-size:12px;color:#a8bcb4;margin-top:26px;letter-spacing:1px}
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  .title-card h1{font-size:20px}
  .sec{padding:16px 14px 12px}
  .duo{gap:10px}
}
@media (max-width:360px){
  .duo{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

  <header class="title-card">
    <h1>🎯 元音组合表格</h1>
    <p class="sub">背单词神器 · 41 个组合</p>
    <p class="meta">看答案 → 重做 → 默写 → 判分</p>
    <div class="btn-row">
      <button class="video-btn" onclick="openVideo()"><span class="play-ico">🎬</span>视频播放</button>
      <button class="video-btn" id="heroShow"><span class="play-ico">👀</span>显示答案</button>
      <button class="video-btn" id="heroReset"><span class="play-ico">🔄</span>重做一遍</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" id="judgeBtn">✓ 判分</button>
    <button class="btn btn-ghost" id="showBtn">显示答案</button>
    <button class="btn btn-plain" id="resetBtn">重做</button>
    <span class="stat" id="stat"><b>0</b> / 41 已填</span>
  </div>

  <div class="result" id="result"></div>

  <div id="tables"></div>

  <section class="tips">
    <h2>💡 怎么用这张表背单词</h2>
    <ul>
      <li><span class="dot"></span><b>第一步 · 看</b>：点「显示答案」把四张表通看一遍，注意每个组合长什么样。</li>
      <li><span class="dot"></span><b>第二步 · 默</b>：点「重做」清空，凭记忆把 41 个组合一个一个填回去。</li>
      <li><span class="dot"></span><b>第三步 · 判</b>：点「判分」，<span class="tag">绿色 = 对</span><span class="tag">红色 = 错</span>，错的格再记一遍。</li>
      <li><span class="dot"></span><b>小技巧</b>：填完按「回车」自动跳下一格，一路填到底不用点。</li>
    </ul>
  </section>

  <div class="back-wrap">
    <a href="index.html" class="back-btn">🏠 返回主页</a>
  </div>
  <footer>© 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span> · 元音组合表格</footer>
</div>

<script>
/* ===================== 数据（改动只需改这里） =====================
   行标签 k ＋ 每个格子的答案 v，空字符串 "" 表示该位置没有此组合
===================================================== */
var TABLES = [
  { title:'元元组合', cols:['a','e','i','o','u'], rows:[
    { k:'a', v:['',   '',   'ai', '',   'au'] },
    { k:'e', v:['ea', 'ee', 'ei', 'eo', 'eu'] },
    { k:'i', v:['ia', 'ie', '',   '',   '']   },
    { k:'o', v:['oa', 'oe', 'oi', 'oo', 'ou'] },
    { k:'u', v:['',   'ue', 'ui', '',   '']   }
  ]},
  { title:'元辅组合', cols:['r','y','w','l'], rows:[
    { k:'a', v:['ar', 'ay', 'aw', 'al'] },
    { k:'e', v:['er', 'ey', 'ew', '']   },
    { k:'i', v:['ir', '',   '',   '']   },
    { k:'o', v:['or', 'oy', 'ow', '']   },
    { k:'u', v:['ur', 'uy', '',   '']   }
  ]},
  { title:'1元+re组合', duo:1, cols:['re'], rows:[
    { k:'a', v:['are'] },
    { k:'e', v:['ere'] },
    { k:'i', v:['ire'] },
    { k:'o', v:['ore'] },
    { k:'u', v:['ure'] }
  ]},
  { title:'2元+r组合', duo:1, cols:['r'], rows:[
    { k:'ai', v:['air'] },
    { k:'ea', v:['ear'] },
    { k:'ee', v:['eer'] },
    { k:'ei', v:['eir'] },
    { k:'oa', v:['oar'] },
    { k:'oo', v:['oor'] },
    { k:'ou', v:['our'] }
  ]}
];

var CN = ['一','二','三','四','五','六'];
var inputs = [];

/* ---------- 渲染 ---------- */
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function tableHtml(T, idx, no){
  var h = '<section class="sec">';
  h += '<h2><span class="no">' + no + '</span>' + esc(T.title) + '</h2>';
  h += '<div class="tw"><table class="grid"><thead><tr><th class="corner"></th>';
  T.cols.forEach(function(c){ h += '<th>' + esc(c) + '</th>'; });
  h += '</tr></thead><tbody>';
  T.rows.forEach(function(r){
    h += '<tr><th>' + esc(r.k) + '</th>';
    r.v.forEach(function(a, ci){
      if(a === ''){
        h += '<td class="na">—</td>';
      } else {
        h += '<td><input type="text" maxlength="3" data-ans="' + esc(a) + '"'
           + ' data-cell="' + esc(r.k) + '+' + esc(T.cols[ci]) + '"'
           + ' aria-label="' + esc(r.k) + ' 第' + (ci + 1) + '列"'
           + ' inputmode="text" enterkeyhint="next" autocapitalize="off"'
           + ' autocomplete="off" autocorrect="off" spellcheck="false"></td>';
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table></div></section>';
  return h;
}

function render(){
  var html = '', duoOpen = false;
  TABLES.forEach(function(T, ti){
    var isDuo = !!T.duo;
    if(isDuo && !duoOpen){ html += '<div class="duo">'; duoOpen = true; }
    if(!isDuo && duoOpen){ html += '</div>'; duoOpen = false; }
    html += tableHtml(T, ti, CN[ti]);
  });
  if(duoOpen) html += '</div>';
  document.getElementById('tables').innerHTML = html;

  inputs = Array.prototype.slice.call(document.querySelectorAll('.grid input'));
  inputs.forEach(function(el){
    el.addEventListener('input', function(){
      if(/[A-Z]/.test(this.value)){
        var p = this.selectionStart;
        this.value = this.value.toLowerCase();
        try { this.setSelectionRange(p, p); } catch(e){}
      }
      this.parentNode.classList.remove('ok','bad','show');
      hideResult();
      updateStat();
    });
  });
  document.getElementById('stat').innerHTML = '<b>0</b> / ' + inputs.length + ' 已填';
}

/* ---------- 统计 ---------- */
function filledCount(){
  var n = 0;
  inputs.forEach(function(el){ if(el.value.trim()) n++; });
  return n;
}
function updateStat(){
  document.getElementById('stat').innerHTML = '<b>' + filledCount() + '</b> / ' + inputs.length + ' 已填';
}
function hideResult(){
  var rs = document.getElementById('result');
  rs.className = 'result';
  rs.textContent = '';
}
function showResult(cls, txt){
  var rs = document.getElementById('result');
  rs.className = 'result on ' + cls;
  rs.textContent = txt;
}

/* ---------- 判分 ---------- */
function judge(){
  var right = 0, wrong = 0, blank = 0;
  inputs.forEach(function(el){
    var td = el.parentNode;
    td.classList.remove('ok','bad','show');
    var v = el.value.trim().toLowerCase();
    if(!v){ blank++; return; }
    if(v === el.getAttribute('data-ans')){ td.classList.add('ok'); right++; }
    else { td.classList.add('bad'); wrong++; }
  });
  var total = inputs.length;
  if(right === 0 && wrong === 0){
    showResult('warn', '还一格都没填呢 —— 先凭记忆写下组合，再来判分 🙂');
    return;
  }
  if(wrong === 0 && blank === 0){
    showResult('good', '全对！' + total + ' 个元音组合全部拿下 🎉');
    return;
  }
  var msg = '正确 ' + right + ' · 错误 ' + wrong + ' · 未填 ' + blank;
  if(wrong === 0) showResult('good', msg + ' —— 已填的全对，把剩下的补完 👍');
  else showResult('warn', msg + '（红色格再想想，点「显示答案」可以看标准写法）');
}

/* ---------- 显示答案 / 重做 ---------- */
function showAll(){
  inputs.forEach(function(el){
    var td = el.parentNode;
    td.classList.remove('ok','bad');
    el.value = el.getAttribute('data-ans');
    td.classList.add('show');
  });
  updateStat();
  showResult('good', '已显示全部答案，看一遍就点「重做」开始默写 ✍️');
}
function resetAll(){
  inputs.forEach(function(el){
    el.value = '';
    el.parentNode.className = '';
  });
  hideResult();
  updateStat();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 交互：回车跳下一格 / 聚焦滚动 ---------- */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  var i = inputs.indexOf(e.target);
  if(i >= 0 && i < inputs.length - 1) inputs[i+1].focus();
  else e.target.blur();
});
document.addEventListener('focusin', function(e){
  if(e.target.tagName !== 'INPUT') return;
  var el = e.target;
  setTimeout(function(){
    try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(err){}
  }, 260);
});

/* ---------- 绑定 ---------- */
document.getElementById('judgeBtn').addEventListener('click', judge);
document.getElementById('showBtn').addEventListener('click', showAll);
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('heroShow').addEventListener('click', showAll);
document.getElementById('heroReset').addEventListener('click', resetAll);

/* ---------- 视频播放：弹窗打开 pp_video.html（与站内其他页一致） ---------- */
function openVideo(){
  var w = Math.min(960, Math.floor(screen.availWidth * 0.92));
  var h = Math.min(620, Math.floor(screen.availHeight * 0.88));
  var left = Math.floor((screen.availWidth - w) / 2);
  var top = Math.floor((screen.availHeight - h) / 2);
  window.open('pp_video.html', 'ppVideo',
    'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
    ',resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
}

render();
</script>
</body>
</html>
