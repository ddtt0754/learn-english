<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>拼读基础 · 语音训练</title>
<style>
:root{
  --green:#2ebd85;--green-deep:#1fa873;--blue:#2f9df0;--text:#33434b;
  --text-light:#8aa09a;--card:#ffffff;--shadow:0 8px 22px rgba(47,157,240,.10);--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
  color:var(--text);line-height:1.9;min-height:100vh;
  display:flex;justify-content:center;padding:24px 16px calc(40px + env(safe-area-inset-bottom));
}
.container{width:100%;max-width:760px;}

/* 顶部标题卡 */
.title-card{
  position:relative;width:100%;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
  border-radius:22px;padding:30px 20px 26px;text-align:center;color:#fff;overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25);
}
.title-card::before,.title-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);}
.title-card::before{width:120px;height:120px;top:-40px;right:-30px;}
.title-card::after{width:70px;height:70px;bottom:-24px;left:-16px;}
.title-card h1{position:relative;font-size:23px;letter-spacing:2px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.12);}
.title-card .sub{position:relative;margin-top:10px;font-size:13px;letter-spacing:3px;opacity:.94;}

/* 2×2 卡片导航 */
.nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px;}
.nav-card{
  position:relative;display:block;text-decoration:none;
  background:#fff;border-radius:var(--radius);padding:24px 18px 22px;
  box-shadow:var(--shadow);border:2px solid transparent;
  transition:transform .15s, box-shadow .15s;overflow:hidden;
}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(47,157,240,.16)}
.nav-card:active{transform:scale(.98)}
.nav-card .badge{
  position:absolute;top:0;right:0;width:46px;height:46px;
  border-bottom-left-radius:18px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;
}
.nav-card .c-icon{font-size:2.6rem;margin-bottom:10px;}
.nav-card .c-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:6px;}
.nav-card .c-desc{font-size:.78rem;color:var(--text-light);line-height:1.6;}

.c-ipa{border-color:#2ebd85;} .c-ipa .c-icon{color:#2ebd85;} .c-ipa .badge{background:#2ebd85;}
.c-spell{border-color:#2f9df0;} .c-spell .c-icon{color:#2f9df0;} .c-spell .badge{background:#2f9df0;}
.c-link{border-color:#06b6d4;} .c-link .c-icon{color:#06b6d4;} .c-link .badge{background:#06b6d4;}
.c-tone{border-color:#ec4899;} .c-tone .c-icon{color:#ec4899;} .c-tone .badge{background:#ec4899;}

/* 返回按钮 */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:11px 26px;
  background:#fff;color:#1fa873;border:1.5px solid #2ebd85;border-radius:14px;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 4px 12px rgba(46,158,107,.12);transition:transform .15s;
}
.back-btn:active{transform:scale(.97)}
.back-wrap{text-align:center;margin:26px 0 6px}
footer{text-align:center;font-size:12px;color:#a8bcb4;margin-top:26px;letter-spacing:1px}

/* 教练微信号提示框 */
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  .nav-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .title-card h1{font-size:20px}
}
</style>
</head>
<body>
<div class="container">

  <header class="title-card">
    <h1>🗣️ 拼读基础 · 语音训练</h1>
    <p class="sub">国际音标 · 自然拼读 · 连读弱读 · 五大语调</p>
  </header>

  <div class="nav-grid">
    <a href="IPA.html" class="nav-card c-ipa">
      <div class="badge">01</div>
      <div class="c-icon">🔤</div>
      <div class="c-title">国际音标</div>
      <div class="c-desc">48 个音标口诀秒记 · 点音标听发音</div>
    </a>
    <a href="spelling.html" class="nav-card c-spell">
      <div class="badge">02</div>
      <div class="c-icon">📚</div>
      <div class="c-title">自然拼读</div>
      <div class="c-desc">114 个发音规则 · 见词能读</div>
    </a>
    <a href="connected.html" class="nav-card c-link">
      <div class="badge">03</div>
      <div class="c-icon">🔗</div>
      <div class="c-title">连读弱读</div>
      <div class="c-desc">连读规则 · 弱读规律 · 自然语流</div>
    </a>
    <a href="intonation.html" class="nav-card c-tone">
      <div class="badge">04</div>
      <div class="c-icon">🎵</div>
      <div class="c-title">五大语调</div>
      <div class="c-desc">语调规则 · 自然节奏</div>
    </a>
  </div>

  <div class="back-wrap">
    <a href="../index.html" class="back-btn">🏠 返回首页</a>
  </div>
  <footer>© 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span> · 拼读基础 · 语音训练</footer>
</div>
</body>
</html>
