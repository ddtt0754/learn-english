<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2ebd85">
<title>三年级下册 Unit 1 - 短文听读说写训练</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
    min-height:100vh;
    display:flex;justify-content:center;align-items:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:420px;
    background:#fff;border-radius:20px;
    box-shadow:0 10px 30px rgba(47,157,240,.12);
    padding:52px 30px 44px;text-align:center;
  }
  .badge{
    display:inline-block;
    background:linear-gradient(135deg,#35d29a,#2f9df0);
    color:#fff;border-radius:999px;
    padding:6px 16px;font-size:13px;letter-spacing:1px;
  }
  h1{font-size:22px;color:#33434b;margin:20px 0 12px;}
  .tip{font-size:16px;color:#8aa09a;letter-spacing:2px;}
  .back{
    display:inline-block;margin-top:32px;
    padding:11px 28px;border-radius:12px;
    background:#e8f7f0;color:#1fa873;
    text-decoration:none;font-size:14px;font-weight:600;
    transition:transform .15s ease;
    touch-action:manipulation;
  }
  .back:active{transform:scale(.95);}
</style>
</head>
<body>
<div class="card">
  <span class="badge">三年级下册</span>
  <h1>📖 Unit 1</h1>
  <p class="tip">🔨 网页开发中...</p>
  <a class="back" href="index.html">← 返回导航</a>
</div>
</body>
</html>
