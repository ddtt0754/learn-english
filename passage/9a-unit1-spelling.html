<head>

<title>Our Changing World · 单词拼写练习</title>
<style>
  :root{--bg:#eef4f0;--card:#ffffff;--ink:#22303a;--muted:#6b7c86;--red:#e53935;--accent:#2e9e6b;--accent2:#3bb98a;--line:#e9efe9;--soft:#f4f9f6;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;padding-bottom:84px;-webkit-font-smoothing:antialiased;}
  header{background:linear-gradient(135deg,#2e9e6b,#3bb98a);color:#fff;padding:16px 14px 12px;text-align:center;box-shadow:0 2px 10px rgba(46,158,107,.25);}
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px;}
  header p{margin:4px 0 0;font-size:12px;opacity:.92;}
  .bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .timer{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.85);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  .toggle-btn{min-height:38px;padding:0 15px;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.16);color:#fff;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .08s;}
  .toggle-btn:active{transform:scale(.97);}
  .toggle-btn.active{background:#fff;color:var(--accent);border-color:#fff;}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 8px;}
  .tip{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:13px;color:var(--muted);}
  .tip b{color:var(--accent);}
  .card{background:var(--card);border-radius:14px;padding:14px 16px 16px;margin:0 0 14px;box-shadow:0 3px 14px rgba(30,50,40,.07);border:1px solid var(--line);}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .seq{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2e9e6b,#3bb98a);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(46,158,107,.25);}
  .btn-play{flex:0 0 auto;min-height:34px;padding:0 14px;border:none;border-radius:18px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .08s,filter .2s;}
  .btn-play:active{transform:scale(.97);}
  .btn-play:hover{filter:brightness(1.05);}
  .en-sentence{font-size:16.5px;padding:6px 2px;}
  @media (min-width:760px){.en-sentence{font-size:17.5px;}}
  .blank{display:inline-flex;flex-direction:column;vertical-align:baseline;margin:0 2px;}
  .spell{width:7.5em;min-width:64px;padding:4px 8px;border:1.5px solid var(--accent);border-radius:8px;font-size:15px;text-align:center;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;}
  .spell:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(46,158,107,.15);}
  .spell.correct{border-color:#2e9e6b;background:#eafaf1;color:#1f7d56;}
  .spell.wrong{border-color:var(--red);background:#fdecec;color:var(--red);}
  .blank-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:2px;line-height:1.4;display:none;}
  .blank-hint .ph{color:var(--red);font-family:"Arial",sans-serif;}
  .fixed-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(30,50,40,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;max-width:760px;margin:0 auto;}
  .fixed-bar .fbtn{flex:1;min-height:46px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,filter .2s;}
  .fixed-bar .fbtn:active{transform:scale(.97);}
  .fbtn-submit{background:linear-gradient(135deg,#2e9e6b,#3bb98a);color:#fff;box-shadow:0 4px 12px rgba(46,158,107,.22);}
  .fbtn-book{background:#fff;color:var(--accent);border:1.5px solid var(--accent);flex:0 0 auto;min-width:120px;}
  .fbtn-reset{background:#fff;color:var(--muted);border:1.5px solid var(--line);flex:0 0 auto;min-width:84px;}
  .report{background:var(--card);border-radius:14px;padding:16px 16px 18px;margin:0 0 14px;box-shadow:0 3px 14px rgba(30,50,40,.07);border:1px solid var(--line);}
  .report h2{font-size:17px;color:var(--accent);margin:0 0 12px;padding-left:10px;border-left:4px solid var(--accent);}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .stat{flex:1 1 30%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
  .stat .num{font-size:22px;font-weight:800;color:var(--accent);line-height:1.1;}
  .stat .lab{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat.bad .num{color:var(--red);}
  .wrong-card{border:1px solid #f4d3d3;background:#fff7f7;border-radius:12px;padding:12px 14px;margin:0 0 12px;}
  .wrong-sentence{font-size:16px;line-height:1.85;margin-bottom:8px;}
  .err-word{color:var(--red);font-weight:800;border-bottom:2px solid var(--red);padding:0 2px;}
  .wrong-detail{font-size:13.5px;color:#5a4a4a;}
  .wrong-detail .correct{color:var(--red);font-weight:700;}
  .wrong-detail .your{color:var(--red);}
  .add-book{margin-top:10px;min-height:36px;padding:0 14px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:18px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .08s,background .2s;}
  .add-book:active{transform:scale(.97);}
  .add-book.added{background:var(--accent);color:#fff;cursor:default;}
  .report-actions{display:flex;gap:10px;margin-top:6px;}
  .report-actions button{flex:1;min-height:44px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-retry{background:var(--accent);color:#fff;}
  .all-correct{background:#eafaf1;border:1px solid #bfe9cf;color:#1f7d56;border-radius:12px;padding:14px;text-align:center;font-size:15px;font-weight:700;}
  .modal{position:fixed;inset:0;background:rgba(20,40,30,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto;}
  .modal.show{display:flex;}
  .book-panel{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:18px 18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .book-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .book-head h3{margin:0;font-size:17px;color:var(--accent);}
  .book-close{border:none;background:var(--soft);color:var(--muted);border-radius:10px;min-width:36px;min-height:36px;font-size:18px;cursor:pointer;}
  .book-tools{display:flex;gap:10px;margin-bottom:12px;}
  .book-tools button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--accent);}
  .btn-print{background:var(--accent);color:#fff;}
  .btn-clear{background:#fff;color:var(--red);border-color:#f0b9b9;}
  .book-list{max-height:60vh;overflow:auto;}
  .book-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  .book-item .bi-word{font-size:16px;font-weight:700;color:var(--ink);min-width:84px;}
  .book-item .bi-ph{color:var(--red);font-family:"Arial",sans-serif;font-size:13px;}
  .book-item .bi-gloss{color:var(--muted);font-size:13px;flex:1;}
  .book-item .bi-del{border:none;background:#fdecec;color:var(--red);border-radius:8px;min-width:34px;min-height:34px;font-size:16px;cursor:pointer;}
  .book-empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;}
  
  
  
  @media print{
    body{padding:0;background:#fff;}
    body *{visibility:hidden;}
    #bookModal,#bookModal *{visibility:visible;}
    #bookModal{position:absolute;inset:0;display:flex!important;background:#fff;padding:0;align-items:flex-start;}
    .book-panel{box-shadow:none;max-width:none;width:100%;}
    .book-tools,.book-close{display:none!important;}
    .book-item{border:1px solid #ccc;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  }
</style>

", "ph": "/bi ˈsætɪsfaɪd wɪð/", "gloss": "phr. 对……感到满意"}, {"word": "e-payment", "ph": "/ˈiː peɪmənt/", "gloss": "n. 电子支付"}, {"word": "electronic", "ph": "/ɪˌlekˈtrɑːnɪk/", "gloss": "adj. 电子的"}, {"word": "convenient", "ph": "/kənˈviːniənt/", "gloss": "adj. 方便的；便利的"}, {"word": "high-tech", "ph": "/ˌhaɪ ˈtek/", "gloss": "adj. 高科技的"}, {"word": "link", "ph": "/lɪŋk/", "gloss": "v. & n. 连接；联系"}, {"word": "audio", "ph": "/ˈɔːdiəʊ/", "gloss": "n. & adj. 音频（的）"}, {"word": "easily", "ph": "/ˈiːzəli/", "gloss": "adv. 容易地"}, {"word": "Man-made", "ph": "/ˌmæn ˈmeɪd/", "gloss": "adj. 人造的；非天然的"}, {"word": "support", "ph": "/səˈpɔːrt/", "gloss": "v. & n. 支持"}, {"word": "greatly", "ph": "/ˈɡreɪtli/", "gloss": "adv. 大大地；非常"}, {"word": "Mombasa", "ph": "/mɒmˈbæsə/", "gloss": "n. 蒙巴萨（肯尼亚城市）"}, {"word": "port", "ph": "/pɔːrt/", "gloss": "n. 港口"}, {"word": "Kenyan", "ph": "/ˈkenjən/", "gloss": "n. & adj. 肯尼亚人（的）"}, {"word": "truck", "ph": "/trʌk/", "gloss": "n. 卡车"}, {"word": "manager", "ph": "/ˈmænɪdʒər/", "gloss": "n. 经理"}, {"word": "business", "ph": "/ˈbɪznəs/", "gloss": "n. 生意；商业"}, {"word": "product", "ph": "/ˈprɑːdʌkt/", "gloss": "n. 产品"}, {"word": "capital", "ph": "/ˈkæpɪtl/", "gloss": "n. 首都"}, {"word": "miracle", "ph": "/ˈmɪrəkl/", "gloss": "n. 奇迹"}, {"word": "attraction", "ph": "/əˈtrækʃn/", "gloss": "n. 向往的地方；吸引力"}, {"word": "benefit", "ph": "/ˈbenɪfɪt/", "gloss": "n. & v. 益处；使受益"}, {"word": "socialist", "ph": "/ˈsoʊʃəlɪst/", "gloss": "adj. 社会主义的"}, {"word": "lead", "ph": "/liːd/", "gloss": "v. 带领；过（某种生活）"}, {"word": "dust", "ph": "/dʌst/", "gloss": "n. 尘土"}, {"word": "path", "ph": "/pɑːθ/", "gloss": "n. 小路；小径"}, {"word": "Olympic Games", "ph": "/ðə əˈlɪmpɪk ˈɡeɪmz/", "gloss": "n. 奥林匹克运动会"}, {"word": "junior", "ph": "/ˈdʒuːniər/", "gloss": "adj. 低年级的；初级的"}, {"word": "discussion", "ph": "/dɪˈskʌʃn/", "gloss": "n. 讨论"}, {"word": "aspect", "ph": "/ˈæspekt/", "gloss": "n. 方面"}, {"word": "summary", "ph": "/ˈsʌməri/", "gloss": "n. 总结；概括"}]};
const WORDS = DATA.words;
const SENTENCES = DATA.sentences;
const UNIT = "9A Unit 1 · Our Changing World";
const STORE_KEY = "spelling_wrongbook_v1";

function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function appendLiteral(parent,text){var t=document.createElement("span");t.innerHTML=text;while(t.firstChild)parent.appendChild(t.firstChild);}

/* ---------- 渲染句子 ---------- */
const content=document.getElementById("content");
const TOKEN_RE=/(\d+)/g;
SENTENCES.forEach(function(s){
  const card=document.createElement("div");card.className="card";
  const head=document.createElement("div");head.className="card-head";
  const seq=document.createElement("span");seq.className="seq";seq.textContent=s.seq;
  const pbtn=document.createElement("button");pbtn.className="btn-play";pbtn.type="button";pbtn.textContent="▶ 播放";
  pbtn.addEventListener("click",function(){playText(s.spoken);});
  head.appendChild(seq);head.appendChild(pbtn);
  const en=document.createElement("div");en.className="en-sentence";
  const parts=s.display.split(TOKEN_RE);
  parts.forEach(function(part,i){
    if(i%2===1){
      const widx=parseInt(part,10);
      const blank=document.createElement("span");blank.className="blank";
      const inp=document.createElement("input");inp.className="spell";inp.type="text";inp.autocomplete="off";inp.spellcheck=false;inp.dataset.w=widx;
      const hint=document.createElement("span");hint.className="blank-hint";hint.dataset.w=widx;
      blank.appendChild(inp);blank.appendChild(hint);en.appendChild(blank);
    }else{appendLiteral(en,part);}
  });
  card.appendChild(head);card.appendChild(en);content.appendChild(card);
});

/* ---------- 提示切换 ---------- */
let showPh=false,showGloss=false;
function updateHints(){
  document.querySelectorAll(".blank-hint").forEach(function(el){
    const w=WORDS[parseInt(el.dataset.w,10)];
    let ph="",gl="";
    if(showPh) ph='<span class="ph">'+escapeHtml(w.ph)+"</span>";
    if(showGloss) gl='<span class="gl">'+escapeHtml(w.gloss)+"</span>";
    const txt=ph+(ph&&gl?"  ·  ":"")+gl;
    el.innerHTML=txt;
    el.style.display=txt?"block":"none";
  });
}
document.getElementById("btnPh").addEventListener("click",function(){showPh=!showPh;this.classList.toggle("active",showPh);updateHints();});
document.getElementById("btnGloss").addEventListener("click",function(){showGloss=!showGloss;this.classList.toggle("active",showGloss);updateHints();});

/* ---------- 语音播放 ---------- */
const synth=window.speechSynthesis;
function pickVoice(){
  if(!synth)return null;
  const vs=synth.getVoices()||[];
  const en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
  if(!en.length)return null;
  const fav=en.filter(function(v){const n=v.name.toLowerCase();return /female|samantha|zira|google us|karen|tessa|victoria|allison|aria/i.test(n)&&(v.lang.toLowerCase().indexOf("en-us")===0||v.default);});
  if(fav.length)return fav[0];
  const us=en.filter(function(v){return v.lang.toLowerCase()==="en-us";});
  return us.length?us[0]:en[0];
}
function playText(text){
  if(!synth){alert("当前浏览器不支持语音朗读（Web Speech API）。");return;}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";const v=pickVoice();if(v)u.voice=v;
  u.rate=0.92;u.pitch=1.05;
  synth.speak(u);
}
if(synth&&typeof synth.onvoiceschanged!=="undefined"){synth.onvoiceschanged=function(){};}

/* ---------- 计时 ---------- */
const startTime=Date.now();
let frozen=false;
function fmt(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);const r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function tick(){if(frozen)return;document.getElementById("timer").textContent=fmt(Date.now()-startTime);}
const timerId=setInterval(tick,1000);tick();

/* ---------- 错词本 ---------- */
function loadBook(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]");}catch(e){return [];}}
function saveBook(b){localStorage.setItem(STORE_KEY,JSON.stringify(b));}
function updateBookCount(){const n=loadBook().length;document.getElementById("btnBook").textContent="📒 错词本 ("+n+")";}
function addToBook(idx){
  const w=WORDS[idx];const book=loadBook();
  if(book.some(function(x){return x.word===w.word;}))return false;
  book.push({word:w.word,ph:w.ph,gloss:w.gloss,unit:UNIT,ts:Date.now()});
  saveBook(book);updateBookCount();return true;
}
function renderBook(){
  const book=loadBook();const list=document.getElementById("bookList");
  if(!book.length){list.innerHTML='<div class="book-empty">错词本还是空的。在练习报告中点击“加入错词本”即可收录。</div>';return;}
  let h="";
  book.forEach(function(x){
    h+='<div class="book-item"><span class="bi-word">'+escapeHtml(x.word)+'</span>'
      +'<span class="bi-ph">'+escapeHtml(x.ph)+'</span>'
      +'<span class="bi-gloss">'+escapeHtml(x.gloss)+'</span>'
      +'<button class="bi-del" data-w="'+escapeHtml(x.word)+'" title="删除">×</button></div>';
  });
  list.innerHTML=h;
}
updateBookCount();
const bookModal=document.getElementById("bookModal");
document.getElementById("btnBook").addEventListener("click",function(){renderBook();bookModal.classList.add("show");bookModal.setAttribute("aria-hidden","false");});
document.getElementById("bookClose").addEventListener("click",function(){bookModal.classList.remove("show");bookModal.setAttribute("aria-hidden","true");});
bookModal.addEventListener("click",function(e){if(e.target===bookModal){bookModal.classList.remove("show");}});
document.getElementById("btnPrint").addEventListener("click",function(){window.print();});
document.getElementById("btnClear").addEventListener("click",function(){if(confirm("确定清空错词本？")){localStorage.removeItem(STORE_KEY);renderBook();updateBookCount();}});
document.getElementById("bookList").addEventListener("click",function(e){const b=e.target.closest(".bi-del");if(!b)return;const w=b.dataset.w;const book=loadBook().filter(function(x){return x.word!==w;});saveBook(book);renderBook();updateBookCount();});

/* ---------- 提交 ---------- */
function sentenceOf(widx){for(let i=0;i<SENTENCES.length;i++){if(SENTENCES[i].widxs.indexOf(widx)>=0)return SENTENCES[i];}return null;}
function renderRedSentence(s,redWidx){
  const parts=s.display.split(TOKEN_RE);let html="";
  parts.forEach(function(part,i){
    if(i%2===1){const widx=parseInt(part,10);
      if(widx===redWidx){html+='<span class="err-word">'+escapeHtml(WORDS[widx].word)+"</span>";}
      else{html+=escapeHtml(WORDS[widx].word);}
    }else{html+=escapeHtml(part);}
  });
  return html;
}
function submit(){
  if(frozen)return;
  frozen=true;clearInterval(timerId);
  const elapsed=Date.now()-startTime;
  const results=[];let correct=0;
  WORDS.forEach(function(w,idx){
    const inp=document.querySelector('.spell[data-w="'+idx+'"]');
    const val=(inp?inp.value:"").trim().replace(/\s+/g," ");
    const ans=w.word.trim().replace(/\s+/g," ");
    const ok=val.length>0&&val.toLowerCase()===ans.toLowerCase();
    if(inp){inp.classList.add(ok?"correct":"wrong");}
    if(ok)correct++;else results.push({idx:idx,val:val});
  });
  const total=WORDS.length;const wrong=results.length;const acc=total?Math.round(correct/total*100):0;
  const area=document.getElementById("reportArea");
  let h='<div class="report"><h2>练习报告</h2>';
  h+='<div class="stats">'
    +'<div class="stat"><div class="num">'+fmt(elapsed)+'</div><div class="lab">用时</div></div>'
    +'<div class="stat"><div class="num">'+total+'</div><div class="lab">总词数</div></div>'
    +'<div class="stat"><div class="num">'+correct+'</div><div class="lab">正确</div></div>'
    +'<div class="stat bad"><div class="num">'+wrong+'</div><div class="lab">错误</div></div>'
    +'<div class="stat"><div class="num">'+acc+'%</div><div class="lab">正确率</div></div>'
    +'</div>';
  if(!wrong){
    h+='<div class="all-correct">🎉 全部拼写正确！用时 '+fmt(elapsed)+'，正确率 100%。</div>';
  }else{
    h+='<div class="wrong-list">';
    results.forEach(function(r){
      const w=WORDS[r.idx];const s=sentenceOf(r.idx);
      h+='<div class="wrong-card">';
      h+='<div class="wrong-sentence">句'+s.seq+'：'+renderRedSentence(s,r.idx)+'</div>';
      h+='<div class="wrong-detail">正确：<b class="correct">'+escapeHtml(w.word)+'</b>'
        +' <span class="ph" style="color:#e53935;font-family:Arial">'+escapeHtml(w.ph)+'</span> '+escapeHtml(w.gloss)
        +'<br>你的答案：<span class="your">'+(r.val?escapeHtml(r.val):"(空)")+'</span></div>';
      h+='<button class="add-book" data-w="'+r.idx+'">＋ 加入错词本</button>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<div class="report-actions"><button class="btn-retry" id="btnRetry" type="button">↻ 重新练习</button></div>';
  h+='</div>';
  area.innerHTML=h;
  area.scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("btnSubmit").addEventListener("click",submit);
document.getElementById("reportArea").addEventListener("click",function(e){
  const rb=e.target.closest(".add-book");
  if(rb&&!rb.classList.contains("added")){addToBook(parseInt(rb.dataset.w,10));rb.textContent="✓ 已加入错词本";rb.classList.add("added");}
  const rt=e.target.closest("#btnRetry");
  if(rt){location.reload();}
});

/* ---------- 重置 ---------- */
document.getElementById("btnReset").addEventListener("click",function(){
  if(frozen&&!confirm("当前已提交，重置将清空答案并重新计时，是否继续？"))return;
  document.querySelectorAll(".spell").forEach(function(inp){inp.value="";inp.classList.remove("correct","wrong");});
  document.getElementById("reportArea").innerHTML="";
  if(frozen){location.reload();}
});
</script>
</body>
