.label{font-size:.72rem;font-weight:800;color:var(--blue);margin:12px 0 6px;letter-spacing:.04em;

.rules b{color:var(--blue-d)}

/* 操作按钮 */
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;font-weight:700;font-size:.8rem;padding:11px 8px;border-radius:11px;
  cursor:pointer;transition:transform .12s;border:1.5px solid transparent}
.btn:active{transform:scale(.96)}
.btn-prompt{background:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(46,158,107,.28)}

/* 中间 AI 对话训练区 */
.ai-area{margin:8px 0 22px;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);background:#fff}
.ai-bar{background:var(--brand);color:#fff;font-weight:800;font-size:.86rem;
  padding:12px 16px;display:flex;align-items:center;gap:7px}
.ai-bar .dot{width:8px;height:8px;border-radius:50%;background:#7dffce;box-shadow:0 0 0 3px rgba(125,255,206,.35)}
.ai-area iframe{width:100%;height:100vh;height:100dvh;border:0;display:block;background:#eef6f1}
.ai-fallback{font-size:.72rem;color:var(--sub);text-align:center;padding:8px;border-top:1px solid var(--line)}
.ai-fallback a{color:var(--blue);font-weight:700}

/* 页尾 */
.foot{text-align:center;color:var(--sub);font-size:.74rem;line-height:1.7;padding-top:8px}
.foot .strong{color:var(--blue-d);font-weight:800;font-size:.82rem}

/* Toast */
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);
  background:rgba(31,45,61,.94);color:#fff;font-weight:700;font-size:.82rem;
  padding:11px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:99;display:flex;align-items:center;gap:7px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ck{color:#5dffb0;font-weight:900}

<script>
/* ===== AI 教练提示词（问答互动）===== */
const DATA = {
  p2:{
    prompt:`扮演一对一外教，围绕人教版六年级上册第三单元主题Healthy life进行口语训练。\n规则：\n1. 每轮仅一句英文提问 +【中文解释】，一轮一问。\n2. 学生回答：先鼓励 → 精简纠错（中文，只纠关键错误）→ 下一题。\n3. 难度由浅入深，优先使用本单元句型单词，减少超纲。\n4. 听不懂就重复英文+中文释义；不替学生回答，不一次性多个问题。\n5. 问答5～8轮后，自动做简短练习总结。\n开场：\nHi! Welcome to our oral practice today. Our topic is from this textbook unit. Are you ready?\n【中文解释】嗨！欢迎来到今天的口语练习。我们今天的话题来自课本这个单元，准备好了吗？`
  }
};

/* ===== 复制 + Toast ===== */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg||'已复制';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制')).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-999px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); showToast('已复制'); }
  catch(e){ showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
</script>
