<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="YRTLVE5ZKMg6xlnxxrz9yd">
<head data-page-node-id="MlMvMi7y66iCiAe9Z7Ep2w">
<meta charset="UTF-8" data-page-node-id="IjqL17O0kxAtUD7EwqNNAB">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="9rAGrgrOiXrJHGAbd715sY">
<title>🎬 六上 Unit 3 情景视频 · Healthy life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,#0f172a,#1e293b);overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  display:flex;flex-direction:column;color:#fff;
}
/* 顶部标题条 */
.v-header{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 14px;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
  color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);text-align:center;
}
.v-header .sub{font-size:12px;font-weight:500;opacity:.92;letter-spacing:0}
/* 主体：左播放器 + 右播放列表 */
.v-main{flex:1;min-height:0;display:flex;gap:14px;padding:14px}
.v-stage{flex:2;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.v-stage video{
  max-width:100%;max-height:100%;width:auto;height:auto;
  background:#000;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
.v-now{flex-shrink:0;font-size:13px;color:#cbd5e1;text-align:center}
.v-now b{color:#7dffce}

/* 播放列表 */
.v-list{
  flex:0 0 320px;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding-right:2px;
}
.v-list::-webkit-scrollbar{width:6px}
.v-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.v-group{font-size:12px;font-weight:800;color:#7dffce;letter-spacing:.05em;margin:6px 2px 2px}
.v-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  transition:background .15s,transform .1s,border-color .15s;
}
.v-item:hover{background:rgba(255,255,255,.13)}
.v-item:active{transform:scale(.98)}
.v-item.active{background:linear-gradient(135deg,rgba(53,210,154,.28),rgba(47,157,240,.28));border-color:#35d29a}
.v-idx{
  flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;background:rgba(255,255,255,.14);color:#e2e8f0;
}
.v-item.active .v-idx{background:#35d29a;color:#0f172a}
.v-info{flex:1;min-width:0}
.v-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-page{font-size:11px;color:#94a3b8;margin-top:1px}
.v-play{flex:0 0 auto;font-size:12px;color:#7dffce;font-weight:700}

/* 控制条 */
.v-controls{
  flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(15,23,42,.95);
}
.vc-btn{
  padding:10px 16px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;transition:background .15s,transform .12s;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;
}
.vc-btn:hover{background:rgba(255,255,255,.25)}
.vc-btn:active{transform:scale(.95)}
.vc-btn.home{background:#35d29a;color:#0f172a;border-color:transparent;font-weight:800}
.vc-btn.home:hover{background:#2fbf8d}
.vc-speed{color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:8px;min-width:78px;text-align:center;font-weight:700}
@media (max-width:760px){
  .v-main{flex-direction:column;gap:10px;padding:10px}
  .v-stage{flex:1 1 auto}
  .v-list{flex:0 0 auto;max-height:38vh}
  .vc-btn{padding:9px 13px;font-size:13px}
}
</style>
</head>
<body data-page-node-id="17y8XpE7Z3scQcyq3EvL5c">

<div class="v-header" data-page-node-id="vMQYa6D2rt1nuCSKMWxX6c">🎬 六年级上册 Unit 3 · Healthy life 情景视频 <span class="sub" data-page-node-id="SEdj3oF57L5eEqOvGyyPiR">（共 4 个 · 点击列表切换）</span></div>

<div class="v-main" data-page-node-id="pG8MieuOl3R3kMnwWAKDuW">
  <div class="v-stage" data-page-node-id="30ORvjEvUDtgTc1NYAHyUA">
    <video id="player" preload="metadata" playsinline controls autoplay data-page-node-id="ziE8SFUYTIGBUex9R3iIWJ"></video>
    <div class="v-now" id="nowTitle" data-page-node-id="T2UTBef4hBeQIzxUwQKCPb">正在播放：<b data-page-node-id="ihdJ3cVkxdDG50DKvNprmN">—</b></div>
  </div>
  <div class="v-list" id="playlist" data-page-node-id="gCdbyoCaIMbayEBq71RE0P"><!-- JS 生成 --></div>
</div>

<div class="v-controls" data-page-node-id="3svIB7Bw5zV1ltY4u81STI">
  <span class="vc-speed" id="speedLabel" data-page-node-id="zRXtzcWOGF8clQ4uU0zky3">1.0x</span>
  <button class="vc-btn" onclick="prevVideo()" data-page-node-id="xLRHymO29R6a6YdqpdPwbW">⏮ 上一个</button>
  <button class="vc-btn" onclick="nextVideo()" data-page-node-id="ntkyGvoLAdRwrgknjq2LTG">⏭ 下一个</button>
  <button class="vc-btn" onclick="slowDown()" data-page-node-id="1TqHQhlyjzOLH0YEEZEX9p">⏪ 变慢</button>
  <button class="vc-btn" onclick="speedUp()" data-page-node-id="ZwtUv2au4Wcl8Ngvy7gYzh">⏩ 变快</button>
  <button class="vc-btn" id="pauseBtn" onclick="togglePause()" data-page-node-id="vdh1TZRfzkW9vgjvD6E3rM">⏸ 暂停</button>
  <a class="vc-btn home" href="6a-unit3.html" data-page-node-id="yAa5aWntYK5iBYRB7I2hBg">🏠 返回</a>
</div>

<script>
"use strict";
/* ===== 播放列表数据（视频来源：../resources/textbook/grade6Volume1/ Unit3 相关） ===== */
var BASE = "../resources/textbook/grade6Volume1/";
var VIDEOS = [
  {f:"Unit3-A-P28-v1.mp4",    name:"Part A · Let's talk",     page:"P28"},
  {f:"Unit3-A-P29-v1.mp4",    name:"Part A · Let's learn",    page:"P29"},
  {f:"Unit3-B-P31-v1.mp4",    name:"Part B · Let's talk",     page:"P31"},
  {f:"Unit3-B-P32-v1.mp4",    name:"Part B · Let's learn",    page:"P32"}
];

var player = document.getElementById('player');
var pauseBtn = document.getElementById('pauseBtn');
var speedLabel = document.getElementById('speedLabel');
var listEl = document.getElementById('playlist');
var nowTitle = document.getElementById('nowTitle');
var speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
var speedIdx = 2;
var curIdx = 0;

/* ---- 渲染播放列表 ---- */
function renderList(){
  var h = '<div class="v-group">Unit 3 · Healthy life</div>';
  VIDEOS.forEach(function(v, i){
    h += '<div class="v-item' + (i === curIdx ? ' active' : '') + '" data-i="' + i + '">'
       +   '<span class="v-idx">' + (i + 1) + '</span>'
       +   '<div class="v-info"><div class="v-name">' + v.name + '</div>'
       +     '<div class="v-page">课本 ' + v.page + '</div></div>'
       +   '<span class="v-play">▶</span>'
       + '</div>';
  });
  listEl.innerHTML = h;
}
listEl.addEventListener('click', function(e){
  var item = e.target.closest('.v-item');
  if(item) playAt(parseInt(item.dataset.i, 10));
});

/* ---- 切换播放 ---- */
function playAt(i){
  if(i < 0 || i >= VIDEOS.length) return;
  curIdx = i;
  var v = VIDEOS[i];
  player.src = BASE + v.f;
  player.playbackRate = speeds[speedIdx];
  nowTitle.innerHTML = '正在播放：<b>' + v.name + '（' + v.page + '）</b>';
  document.querySelectorAll('.v-item').forEach(function(el){
    el.classList.toggle('active', parseInt(el.dataset.i, 10) === i);
  });
  var active = listEl.querySelector('.v-item.active');
  if(active) active.scrollIntoView({block:'nearest'});
  var p = player.play();
  if(p && p.catch) p.catch(function(){ /* 自动播放被拦截，等待用户点击 */ });
}
function nextVideo(){ if(curIdx < VIDEOS.length - 1) playAt(curIdx + 1); }
function prevVideo(){ if(curIdx > 0) playAt(curIdx - 1); }

/* ---- 播放 / 倍速控制 ---- */
function togglePause(){
  if(player.paused){ player.play(); pauseBtn.textContent = '⏸ 暂停'; }
  else { player.pause(); pauseBtn.textContent = '▶ 继续'; }
}
function speedUp(){ if(speedIdx < speeds.length - 1) speedIdx++; applySpeed(); }
function slowDown(){ if(speedIdx > 0) speedIdx--; applySpeed(); }
function applySpeed(){
  player.playbackRate = speeds[speedIdx];
  speedLabel.textContent = speeds[speedIdx].toFixed(2).replace(/\.?0+$/, '') + 'x';
}
player.addEventListener('play', function(){ pauseBtn.textContent = '⏸ 暂停'; });
player.addEventListener('pause', function(){ pauseBtn.textContent = '▶ 继续'; });
player.addEventListener('ended', function(){
  pauseBtn.textContent = '▶ 继续';
  if(curIdx < VIDEOS.length - 1) playAt(curIdx + 1);   /* 播完自动下一个 */
});

/* ---- 键盘快捷键 ---- */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') location.href = '6a-unit3.html';
  if(e.key === ' '){ e.preventDefault(); togglePause(); }
  if(e.key === 'ArrowLeft') slowDown();
  if(e.key === 'ArrowRight') speedUp();
  if(e.key === 'ArrowUp'){ e.preventDefault(); prevVideo(); }
  if(e.key === 'ArrowDown'){ e.preventDefault(); nextVideo(); }
});

/* ---- 初始化 ---- */
renderList();
playAt(0);
applySpeed();
</script>
</body>
</html>
